      if (state.player.qualityOptions.length > 0) {
        qualityHtml += sheetOption("Auto", "adaptive", 'data-quality="0"', state.player.qualityTarget === 0);
        state.player.qualityOptions.forEach(function (height) {
          qualityHtml += sheetOption(height + "p", qualityLabel(height), 'data-quality="' + height + '"', state.player.qualityTarget === height);
        });
      } else {
        qualityHtml += '<div class="sheet-empty">A single file with no quality levels.</div>';
      }
      settingsMenu.innerHTML = qualityHtml + "</div>";
      return;
    }

    if (view === "source") {
      var sourceHtml = sheetHead("Source") + '<div class="sheet-list">';
      if (state.player.sources.length === 0) {
        sourceHtml += '<div class="sheet-empty">No sources yet.</div>';
      } else {
        sourceHtml += sheetOption("Auto", "best available", 'data-source="-1"', state.player.auto);
        state.player.sources.forEach(function (source, index) {
          sourceHtml += sheetOption(
            source.provider || "source",
            source.label || source.type || "",
            'data-source="' + index + '"',
            !state.player.auto && index === state.player.sourceIndex
          );
        });
      }
      settingsMenu.innerHTML = sourceHtml + "</div>";
      return;
    }

    if (view === "subtitles") {
      var subHtml = sheetHead("Subtitles") + '<div class="sheet-list">';
      subHtml += sheetOption("Off", "", 'data-subtitle="-1"', state.player.subtitleIndex < 0);
      state.player.subtitles.forEach(function (track) {
        subHtml += sheetOption(track.name, track.lang, 'data-subtitle="' + track.index + '"', state.player.subtitleIndex === track.index);
      });
      if (state.player.subtitles.length === 0) {
        subHtml += '<div class="sheet-empty">Nothing embedded in this source.</div>';
      }
      subHtml += "</div>";
      subHtml += '<div class="sheet-rule"></div><div class="sheet-list">';
      subHtml += sheetOption(
        state.player.externalPending ? "Searching OpenSubtitles…" : "Find on OpenSubtitles",
        captionLabel(),
        'data-action="search-subtitles"',
        false
      );
      subHtml += "</div>";
      subHtml += '<div class="sheet-note">Saved as WebVTT from OpenSubtitles, matched on the title\'s IMDb id and your language.</div>';
      settingsMenu.innerHTML = subHtml;
      return;
    }

    if (view === "audio") {
      var audioHtml = sheetHead("Audio") + '<div class="sheet-list">';
      if (state.player.audioTracks.length > 0) {
        state.player.audioTracks.forEach(function (track) {
          audioHtml += sheetOption(track.name, track.lang, 'data-audio="' + track.index + '"', state.player.audioIndex === track.index);
        });
      } else {
        audioHtml += '<div class="sheet-empty">This stream ships one audio track.</div>';
      }
      settingsMenu.innerHTML = audioHtml + "</div>";
      return;
    }

    if (view === "sleep") {
      var sleepHtml = sheetHead("Sleep timer") + '<div class="sheet-list">';
      SLEEP_CHOICES.forEach(function (minutes) {
        sleepHtml += sheetOption(minutes === 0 ? "Off" : minutes + " minutes", "", 'data-sleep="' + minutes + '"',
          minutes === 0 ? !state.player.sleepAt : Boolean(state.player.sleepAt) && state.player.sleepMinutes === minutes);
      });
      sleepHtml += "</div>";
      sleepHtml += '<div class="sheet-note">Pauses playback and leaves the player open.</div>';
      settingsMenu.innerHTML = sleepHtml;
      return;
    }

    if (view === "party") {
      settingsMenu.innerHTML = sheetHead("Watch party") +
        '<div class="sheet-list">' +
        sheetOption("Copy invite link", "", 'data-action="copy-link"', false) +
        "</div>" +
        '<div class="sheet-note">Sends the title page, not the stream. Everyone presses play at the same time - there is no sync server to drift against.</div>';
      return;
    }

    if (view === "playback") {
      var playHtml = sheetHead("Playback settings");
      playHtml += '<div class="sheet-list">';
      SPEEDS.forEach(function (speed) {
        playHtml += sheetOption(speed + "×", speed === 1 ? "normal" : "", 'data-speed="' + speed + '"', prefs.speed === speed);
      });
      playHtml += "</div>";
      playHtml += '<div class="sheet-rule"></div>';
      playHtml += '<div class="sheet-list">';
      SEEK_STEPS.forEach(function (step) {
        playHtml += sheetOption("Skip " + step + "s", "", 'data-seek="' + step + '"', prefs.seekStep === step);
      });
      playHtml += "</div>";
      playHtml += '<div class="sheet-rule"></div>';
      playHtml += '<div class="sheet-list">';
      playHtml += sheetOption("Autoplay next", prefs.autoplayNext ? "on" : "off", 'data-autoplay="' + (prefs.autoplayNext ? "1" : "0") + '"', prefs.autoplayNext);
      playHtml += sheetOption("Captions language", captionLabel(), 'data-sheet="lang"', false);
      playHtml += "</div>";
      playHtml += '<div class="sheet-rule"></div>';
      playHtml += '<div class="sheet-list">';
      playHtml += sheetOption("Caption size", CAPTION_SIZES[prefs.captionSize] || "", 'data-caption-size=""', false);
      ["sm", "md", "lg"].forEach(function (size) {
        playHtml += sheetOption("Size · " + size, CAPTION_SIZES[size], 'data-caption-size="' + size + '"', prefs.captionSize === size);
      });
      ["dim", "solid", "none"].forEach(function (bg) {
        playHtml += sheetOption("Backing · " + bg, "", 'data-caption-bg="' + bg + '"', prefs.captionBg === bg);
      });
      playHtml += "</div>";
      settingsMenu.innerHTML = playHtml;
      return;
    }

    if (view === "lang") {
      var langHtml = sheetHead("Caption language") + '<div class="sheet-list">';
      CAPTION_LANGUAGES.forEach(function (entry) {
        langHtml += sheetOption(entry[1], entry[0], 'data-caption-lang="' + entry[0] + '"', prefs.captionLang === entry[0]);
      });
      langHtml += "</div>";
      langHtml += '<div class="sheet-note">Auto follows the browser, so captions arrive in whatever language the system is set to.</div>';
      settingsMenu.innerHTML = langHtml;
      return;
    }

    // Root: the tile grid, the action rows, then the caption switch.
    var html = '<div class="sheet-grid">';
    html += sheetTile("Quality", qualityValue(), 'data-sheet="quality"', state.player.qualityTarget > 0);
    html += sheetTile("Source", sourceValue(), 'data-sheet="source"', !state.player.auto && Boolean(state.player.source));
    html += sheetTile("Subtitles", subtitleValue(), 'data-sheet="subtitles"', state.player.subtitleIndex >= 0);
    html += sheetTile("Audio", audioValue(), 'data-sheet="audio"', state.player.audioIndex >= 0);
    html += "</div>";
    html += '<div class="sheet-rows">';
    html += sheetRow("Download", "", 'data-action="download"', "download");
    html += sheetRow("Watch Party", "", 'data-sheet="party"', "party");
    html += sheetRow("Sleep Timer", sleepValue(), 'data-sheet="sleep"', "clock");
    html += "</div>";
    html += '<div class="sheet-rule"></div>';
    html += '<button class="sheet-switch" type="button" role="switch" aria-checked="' +
      (state.player.subtitleIndex >= 0 ? "true" : "false") + '" data-action="toggle-captions">' +
      "<span>Enable Subtitles</span><span class=\"switch\"></span></button>";
    html += sheetRow("Playback Settings", "", 'data-sheet="playback"', "caretRight");
    settingsMenu.innerHTML = html;
  }

  var SKIP_INTRO_TARGET = 90;
  function hideSkipIntro() {
    skipIntro.hidden = true;
  }
  function updateSkipIntro() {
    var context = state.player.context;
    if (!state.player.open || !context || !context.detail || context.detail.mediaType !== "tv") {
      hideSkipIntro();
      return;
    }
    if (!Number.isFinite(video.duration) || video.duration < 300) {
      hideSkipIntro();
      return;
    }
    var time = video.currentTime;
    skipIntro.hidden = !(time > 4 && time < SKIP_INTRO_TARGET - 8);
  }
  function skipIntroNow() {
    var target = SKIP_INTRO_TARGET;
    if (Number.isFinite(video.duration)) { target = Math.min(target, video.duration - 5); }
    video.currentTime = Math.max(0, target);
    hideSkipIntro();
    showControls();
    toast("Skipped intro");
  }

  function updatePlayerHeader() {
    var context = state.player.context;
    var detail = context && context.detail;
    if (!detail) {
      playerTitle.textContent = "";
      playerNext.hidden = true;
      return;
    }
    var title = detail.title;
    if (detail.mediaType === "tv") {
      var episode = context.seasonData && (context.seasonData.episodes || []).find(function (entry) { return entry.number === context.episode; });
      title += " · S" + context.season + "E" + context.episode;
      if (episode) { title += " · " + episode.name; }
    }
    playerTitle.textContent = title;
    var next = nextEpisodeInfo();
    playerNext.hidden = !next;
    if (next) {
      playerNext.innerHTML = "Next: S" + next.season + "E" + next.episode + " " + icon("chevronRight", { size: 14 });
    }
    renderSourceMenu();
  }

  // The sheet repaints from state, so a source change just asks for a redraw.
  function renderSourceMenu() {
    if (!settingsMenu.hidden) { renderSettingsMenu(); }
  }

  function showLoading(text) {
    loadingText.textContent = text || "Loading…";
    loadingEl.hidden = false;
    bigPlay.hidden = true;
    errorEl.hidden = true;
    clearNextTimer();
    nextCard.hidden = true;
  }
  function hideLoading() {
    loadingEl.hidden = true;
  }
  function showError(title, message) {
    hideLoading();
    bigPlay.hidden = true;
    clearNextTimer();
    nextCard.hidden = true;
    errorTitle.textContent = title || "Playback failed";
    errorText.textContent = message || "Something went wrong.";
    errorEl.hidden = false;
    showControls();
  }
  function hideError() {
    errorEl.hidden = true;
  }
  function showBigPlay() {
    bigPlay.hidden = false;
    bigPlay.setAttribute("aria-label", video.paused ? "Play" : "Pause");
  }
  function hideBigPlay() {
    bigPlay.hidden = true;
  }
  var NEXT_COUNTDOWN_SECONDS = 8;
  function clearNextTimer() {
    clearInterval(state.player.nextTimer);
    state.player.nextTimer = null;
    state.player.nextDeadline = 0;
  }
  function updateNextCountdown() {
    var timerEl = nextCard.querySelector(".next-timer");
    if (!timerEl) { return; }
    var seconds = Math.max(0, Math.ceil((state.player.nextDeadline - Date.now()) / 1000));
    timerEl.textContent = "Playing next in " + seconds + "s";
  }
  function startNextCountdown() {
    clearNextTimer();
    if (!prefs.autoplayNext) {
      var note = nextCard.querySelector(".next-timer");
      if (note) { note.textContent = "Autoplay next is off."; }
      return;
    }
    state.player.nextDeadline = Date.now() + NEXT_COUNTDOWN_SECONDS * 1000;
    updateNextCountdown();
    state.player.nextTimer = setInterval(function () {
      if (!state.player.open || nextCard.hidden) {
        clearNextTimer();
        return;
      }
      if (Date.now() >= state.player.nextDeadline) {
        clearNextTimer();
        playNextEpisode();
        return;
      }
      updateNextCountdown();
    }, 250);
  }
  function showNextCard() {
    var next = nextEpisodeInfo();
    if (!next) {
      showBigPlay();
      return;
    }
    var episode = next.episodeData;
    nextCard.innerHTML =
      '<div class="eyebrow">Up next</div>' +
      "<strong>S" + next.season + " E" + next.episode + (episode ? " · " + esc(episode.name) : "") + "</strong>" +
      '<div class="next-actions">' +
      '<button class="btn primary" type="button" id="next-play">' + icon("play", { fill: true, size: 15 }) + " Play next episode</button>" +
      '<button class="btn ghost" type="button" id="next-cancel">Cancel</button>' +
      "</div>" +
      '<div class="next-timer" aria-live="polite"></div>';
    nextCard.hidden = false;
    bigPlay.hidden = true;
    nextCard.querySelector("#next-play").addEventListener("click", function () {
      clearNextTimer();
      playNextEpisode();
    });
    nextCard.querySelector("#next-cancel").addEventListener("click", function () {
      clearNextTimer();
      hideNextCard();
      showBigPlay();
    });
    startNextCountdown();
  }
  function hideNextCard() {
    clearNextTimer();
    nextCard.hidden = true;
    nextCard.innerHTML = "";
  }

  function nextEpisodeInfo() {
    var context = state.player.context;
    if (!context || !context.detail || context.detail.mediaType !== "tv") { return null; }
    var episodes = (context.seasonData && context.seasonData.episodes) || [];
    var index = episodes.findIndex(function (episode) { return episode.number === context.episode; });
    if (index >= 0 && index + 1 < episodes.length) {
      return { season: context.season, episode: episodes[index + 1].number, episodeData: episodes[index + 1] };
    }
    if (context.season < (context.detail.seasons || 0)) {
      return { season: context.season + 1, episode: 1, episodeData: null };
    }
    return null;
  }

  async function playNextEpisode() {
    clearNextTimer();
    hideNextCard();
    var next = nextEpisodeInfo();
    var context = state.player.context;
    if (!next || !context) { return; }
    try {
      var seasonData = next.season === context.season ? context.seasonData : await api("/api/tv/" + context.detail.id + "/season/" + next.season);
      var episodes = seasonData.episodes || [];
      var target = episodes.some(function (episode) { return episode.number === next.episode; }) ? next.episode : (episodes[0] ? episodes[0].number : 1);
      state.season = next.season;
      state.episode = target;
      state.seasonData = seasonData;
      startPlayback(context.detail, seasonData, next.season, target, { auto: true });
    } catch (error) {
      toast(error.message || "Could not load the next episode.");
    }
  }

  function saveProgress() {
    var context = state.player.context;
    if (!context || !context.detail) { return; }
    var duration = video.duration;
    var time = video.currentTime;
    if (!Number.isFinite(duration) || duration <= 0 || !Number.isFinite(time)) { return; }
    var key = progressKey(context.detail.mediaType, context.detail.id, context.season, context.episode);
    if (time < 5 || time > duration - 10) {
      if (state.progress[key]) {
        delete state.progress[key];
        saveJson(PROGRESS_KEY, state.progress);
      }
      return;
    }
    state.progress[key] = {
      key: key,
      mediaType: context.detail.mediaType,
      id: context.detail.id,
      season: context.season,
      episode: context.episode,
      title: context.detail.title,
      poster: context.detail.poster,
      backdrop: context.detail.backdrop,
      releaseDate: context.detail.releaseDate,
      rating: context.detail.rating,
      time: time,
      duration: duration,
      updated: Date.now()
    };
    saveJson(PROGRESS_KEY, state.progress);
  }

  function clearProgress() {
    var context = state.player.context;
    if (!context || !context.detail) { return; }
    var key = progressKey(context.detail.mediaType, context.detail.id, context.season, context.episode);
    if (state.progress[key]) {
      delete state.progress[key];
      saveJson(PROGRESS_KEY, state.progress);
    }
  }

  /* ---------- player controls ---------- */
  function togglePlay() {
    if (video.paused) {
      video.play().catch(function () { showBigPlay(); });
    } else {
      video.pause();
    }
  }
  function seekBy(seconds) {
    if (!Number.isFinite(video.duration)) { return; }
    video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + seconds));
    updateSeekUI();
    showControls();
  }
  function setVolume(value) {
    var next = Math.max(0, Math.min(1, value));
    video.volume = next;
    video.muted = next === 0;
    updateVolumeUI();
  }
  function toggleMute() {
    if (video.muted || video.volume === 0) {
      video.muted = false;
      if (video.volume === 0) { video.volume = 0.8; }
    } else {
      video.muted = true;
    }
    updateVolumeUI();
  }
  function updateVolumeUI() {
    volumeEl.value = String(video.muted ? 0 : video.volume);
    muteToggle.innerHTML = video.muted || video.volume === 0 ? ICON_MUTE : ICON_VOLUME;
  }
  function updatePlayUI() {
    playToggle.innerHTML = video.paused ? ICON_PLAY : ICON_PAUSE;
    playToggle.setAttribute("aria-label", video.paused ? "Play" : "Pause");
    bigPlay.innerHTML = video.paused ? icon("play", { fill: true, size: 30 }) : icon("pause", { fill: true, size: 30 });
    bigPlay.hidden = !video.paused || !loadingEl.hidden || !errorEl.hidden || !nextCard.hidden;
  }
  function updateSeekUI() {
    var duration = Number.isFinite(video.duration) ? video.duration : 0;
    var current = Number.isFinite(video.currentTime) ? video.currentTime : 0;
    var ratio = duration > 0 ? Math.max(0, Math.min(1, current / duration)) : 0;
    // A hover or a drag owns the bar: playback keeps advancing underneath, but
    // the fill would crawl out from under the pointer if it kept writing here.
    if (!state.player.hovering && !state.player.seeking) {
      seekPlayed.style.width = (ratio * 100).toFixed(2) + "%";
      seekThumb.style.left = (ratio * 100).toFixed(2) + "%";
      seekEl.setAttribute("aria-valuenow", String(Math.round(ratio * 100)));
    }
    timeCurrent.textContent = formatTime(current);
    timeTotal.textContent = formatTime(duration);
    if (video.buffered && video.buffered.length > 0 && duration > 0) {
      var end = 0;
      for (var index = 0; index < video.buffered.length; index += 1) {
        if (video.buffered.start(index) <= current && video.buffered.end(index) > end) {
          end = video.buffered.end(index);
        }
      }
      seekBuffer.style.width = Math.min(100, (end / duration) * 100).toFixed(2) + "%";
    } else {
      seekBuffer.style.width = "0%";
    }
  }
  function showControls() {
    playerEl.classList.remove("idle");
    clearTimeout(state.player.hideTimer);
    if (!video.paused) {
      state.player.hideTimer = setTimeout(function () {
        if (!video.paused && state.player.open && settingsMenu.hidden) {
          playerEl.classList.add("idle");
        }
      }, 3000);
    }
  }
  function seekFromEvent(event) {
    var rect = seekEl.getBoundingClientRect();
    return Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
  }
  function updateSeekHover(on) {
    if (state.player.hovering === on) { return; }
    state.player.hovering = on;
    if (!on) { updateSeekUI(); }
  }

  function previewSeek(event) {
    if (!Number.isFinite(video.duration) || video.duration <= 0) { return; }
    var ratio = seekFromEvent(event);
    seekPlayed.style.width = (ratio * 100).toFixed(2) + "%";
    seekThumb.style.left = (ratio * 100).toFixed(2) + "%";
    seekTooltip.textContent = formatTime(ratio * video.duration);
    seekTooltip.style.left = (ratio * 100).toFixed(2) + "%";
    seekTooltip.hidden = false;
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function () {});
    } else if (playerEl.requestFullscreen) {
      playerEl.requestFullscreen().catch(function () {});
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }
  }
  function togglePip() {
    if (!document.pictureInPictureEnabled) { return; }
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture().catch(function () {});
    } else {
      video.requestPictureInPicture().catch(function () {});
    }
  }
  /* ---------- player events ---------- */
  video.addEventListener("loadedmetadata", function () {
    // Belt and braces for caption lookup: manifest events do not fire for every
    // source, but metadata always does.
    syncSubtitleTracks();
    var resume = state.player.resumeTime;
    if (resume > 5 && Number.isFinite(video.duration) && resume < video.duration - 10) {
      video.currentTime = resume;
      toast("Resumed from " + formatTime(resume));
    }
    state.player.resumeTime = 0;
    hideLoading();
    if (!state.player.hls) { syncSubtitleTracks(); }
    updateSkipIntro();
    updateSeekUI();
    updatePlayUI();
    showControls();
  });
  video.addEventListener("canplay", function () { hideLoading(); });
  video.addEventListener("playing", function () {
    hideLoading();
    updatePlayUI();
    showControls();
  });
  video.addEventListener("waiting", function () {
    if (state.player.open) { showLoading("Buffering…"); }
  });
  video.addEventListener("play", function () {
    updatePlayUI();
    showControls();
  });
  video.textTracks.addEventListener("addtrack", function () { syncSubtitleTracks(); });
  video.textTracks.addEventListener("removetrack", function () { syncSubtitleTracks(); });
  video.addEventListener("seeked", renderCaptions);
  video.addEventListener("pause", function () {
    updatePlayUI();
    renderCaptions();
    showControls();
  });
  video.addEventListener("timeupdate", function () {
    updateSeekUI();
    updateSkipIntro();
    renderCaptions();
    if (Date.now() - state.player.lastSave > 5000) {
      state.player.lastSave = Date.now();
      saveProgress();
    }
  });
  video.addEventListener("progress", updateSeekUI);
  video.addEventListener("volumechange", updateVolumeUI);
  if (video.textTracks && video.textTracks.addEventListener) {
    video.textTracks.addEventListener("addtrack", function () {
      if (state.player.hls) { return; }
      syncSubtitleTracks();
      if (!settingsMenu.hidden) { renderSettingsMenu(); }
    });
  }
  video.addEventListener("ended", function () {
    clearProgress();
    hideLoading();
    showBigPlay();
    updatePlayUI();
    var next = nextEpisodeInfo();
    if (next) {
      showNextCard();
    } else {
      bigPlay.hidden = false;
    }
  });
  video.addEventListener("error", function () {
    if (!state.player.open) { return; }
    handleSourceFailure("This source returned an error.");
  });
  video.addEventListener("click", function () {
    if (playerEl.classList.contains("idle")) {
      showControls();
    } else {
      togglePlay();
    }
  });

  playToggle.addEventListener("click", togglePlay);
  bigPlay.addEventListener("click", togglePlay);
  playerEl.addEventListener("pointerdown", resumeAudio, true);
  playerEl.addEventListener("keydown", resumeAudio, true);
  back10.addEventListener("click", function () { seekBy(-prefs.seekStep); });
  forward10.addEventListener("click", function () { seekBy(prefs.seekStep); });
  captionsBtn.addEventListener("click", toggleCaptions);
  muteToggle.addEventListener("click", toggleMute);
  volumeEl.addEventListener("input", function () {
    setVolume(Number(volumeEl.value));
    prefs.volume = Math.round(video.volume * 100);
    savePrefs();
  });
  fullscreenBtn.addEventListener("click", toggleFullscreen);
  pipBtn.addEventListener("click", togglePip);
  playerClose.addEventListener("click", closePlayer);
  errorClose.addEventListener("click", closePlayer);
  playerNext.addEventListener("click", playNextEpisode);
  skipIntro.addEventListener("click", skipIntroNow);
  retryBtn.addEventListener("click", function () {
    var context = state.player.context;
    if (!context) { closePlayer(); return; }
    var next = state.player.sourceIndex + 1;
    if (next < state.player.sources.length) {
      state.player.auto = true;
      loadSource(state.player.sources[next], state.player.sources, next, true);
      return;
    }
    state.detailSources = [];
    state.detailSourcesKey = "";
    startPlayback(context.detail, context.seasonData, context.season, context.episode, { auto: true, resumeTime: video.currentTime });
  });

  settingsBtn.addEventListener("click", function (event) {
    event.stopPropagation();
    settingsMenu.hidden = !settingsMenu.hidden;
    settingsBtn.setAttribute("aria-expanded", String(!settingsMenu.hidden));
    if (!settingsMenu.hidden) {
      state.player.sheet = "";
      if (state.player.hls) {
        if (state.player.qualityOptions.length === 0) {
          state.player.qualityOptions = hlsQualityOptions(state.player.hls);
        }
        syncSubtitleTracks();
        syncAudioTracks();
      }
      renderSettingsMenu();
      showControls();
    }
  });
  settingsMenu.addEventListener("click", function (event) {
    event.stopPropagation();

    if (event.target.closest("[data-sheet-back]")) {
      state.player.sheet = "";
      renderSettingsMenu();
      return;
    }
    var sheetButton = event.target.closest("[data-sheet]");
    if (sheetButton) {
      state.player.sheet = sheetButton.getAttribute("data-sheet");
      if (state.player.sheet === "quality" && state.player.hls) {
        state.player.qualityOptions = hlsQualityOptions(state.player.hls);
      }
      renderSettingsMenu();
      return;
    }

    var actionButton = event.target.closest("[data-action]");
    if (actionButton) {
      handleSheetAction(actionButton.getAttribute("data-action"));
      return;
    }

    var qualityButton = event.target.closest("[data-quality]");
    if (qualityButton) {
      selectQuality(Number(qualityButton.getAttribute("data-quality")));
      return;
    }
    var subtitleButton = event.target.closest("[data-subtitle]");
    if (subtitleButton) {
      selectSubtitle(Number(subtitleButton.getAttribute("data-subtitle")));
      return;
    }
    var sourceButton = event.target.closest("[data-source]");
    if (sourceButton) {
      var sourceIndex = Number(sourceButton.getAttribute("data-source"));
      if (sourceIndex < 0) {
        var best = pickBestSource(state.player.sources, state.player.context && state.player.context.detail);
        if (best >= 0) { loadSource(state.player.sources[best], state.player.sources, best, true); }
      } else if (state.player.sources[sourceIndex]) {
        loadSource(state.player.sources[sourceIndex], state.player.sources, sourceIndex, false);
      }
      state.player.sheet = "";
      renderSettingsMenu();
      return;
    }
    var audioButton = event.target.closest("[data-audio]");
    if (audioButton) {
      selectAudio(Number(audioButton.getAttribute("data-audio")));
      return;
    }
    var speedButton = event.target.closest("[data-speed]");
    if (speedButton) {
      prefs.speed = Number(speedButton.getAttribute("data-speed")) || 1;
      video.playbackRate = prefs.speed;
      savePrefs();
      applyPrefs();
      renderSettingsMenu();
      return;
    }
    var sizeButton = event.target.closest("[data-caption-size]");
    if (sizeButton) {
      prefs.captionSize = sizeButton.getAttribute("data-caption-size") || "md";
      savePrefs();
      applyPrefs();
      renderSettingsMenu();
      return;
    }
    var bgButton = event.target.closest("[data-caption-bg]");
    if (bgButton) {
      prefs.captionBg = bgButton.getAttribute("data-caption-bg");
      savePrefs();
      applyPrefs();
      renderSettingsMenu();
      return;
    }
    var langButton = event.target.closest("[data-caption-lang]");
    if (langButton) {
      prefs.captionLang = langButton.getAttribute("data-caption-lang");
      savePrefs();
      renderSettingsMenu();
      return;
    }
    var seekButton = event.target.closest("[data-seek]");
    if (seekButton) {
      prefs.seekStep = Number(seekButton.getAttribute("data-seek")) || 10;
      savePrefs();
      applyPrefs();
      renderSettingsMenu();
      return;
    }
    var sleepButton = event.target.closest("[data-sleep]");
    if (sleepButton) {
      setSleepTimer(Number(sleepButton.getAttribute("data-sleep")) || 0);
      renderSettingsMenu();
      return;
    }
    var autoplayButton = event.target.closest("[data-autoplay]");
    if (autoplayButton) {
      prefs.autoplayNext = autoplayButton.getAttribute("data-autoplay") === "1";
      savePrefs();
      renderSettingsMenu();
    }
  });
  document.addEventListener("click", function (event) {
    if (!settingsMenu.hidden && !settingsMenu.contains(event.target) && !settingsBtn.contains(event.target)) {
      settingsMenu.hidden = true;
      settingsBtn.setAttribute("aria-expanded", "false");
    }
  });

  seekEl.addEventListener("pointerdown", function (event) {
    if (!Number.isFinite(video.duration) || video.duration <= 0) { return; }
    state.player.seeking = true;
    seekEl.setPointerCapture(event.pointerId);
    previewSeek(event);
  });
  seekEl.addEventListener("pointerenter", function () {
    updateSeekHover(true);
  });
  seekEl.addEventListener("pointermove", function (event) {
    if (Number.isFinite(video.duration) && video.duration > 0) { previewSeek(event); }
  });
  seekEl.addEventListener("pointerup", function (event) {
    if (!state.player.seeking) { return; }
    state.player.seeking = false;
    // The bar goes back to tracking playback once the drag is committed; the
    // next pointermove re-enters preview mode.
    state.player.hovering = false;
    if (Number.isFinite(video.duration) && video.duration > 0) {
      video.currentTime = seekFromEvent(event) * video.duration;
      updateSeekUI();
    }
    seekTooltip.hidden = true;
  });
  seekEl.addEventListener("pointercancel", function () {
    state.player.seeking = false;
    state.player.hovering = false;
    seekTooltip.hidden = true;
  });
  seekEl.addEventListener("pointerleave", function () {
    updateSeekHover(false);
    if (state.player.seeking) { return; }
    // Left without committing: the bar snaps back to where playback actually
    // is, and the pointer preview goes with it.
    seekTooltip.hidden = true;
    updateSeekUI();
  });
  seekEl.addEventListener("keydown", function (event) {
    if (event.key === "ArrowLeft") { event.preventDefault(); seekBy(-10); }
    if (event.key === "ArrowRight") { event.preventDefault(); seekBy(10); }
    if (event.key === "Home") { event.preventDefault(); video.currentTime = 0; updateSeekUI(); }
    if (event.key === "End" && Number.isFinite(video.duration)) { event.preventDefault(); video.currentTime = video.duration; updateSeekUI(); }
  });

  playerEl.addEventListener("mousemove", showControls);
  playerEl.addEventListener("touchstart", showControls, { passive: true });
  document.addEventListener("fullscreenchange", function () {
    fullscreenBtn.innerHTML = icon(document.fullscreenElement ? "minimize" : "maximize", { size: 22 });
    // Fullscreen is a bigger panel, so the auto cap has to be recomputed.
    if (state.player.open) { applyQualityTarget(); }
  });
  document.addEventListener("keydown", function (event) {
    if (!state.player.open) { return; }
    if (event.target.matches("input, select, textarea")) { return; }
    if (event.key === " " || event.key === "k" || event.key === "K") {
      event.preventDefault();
      togglePlay();
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      seekBy(-10);
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      seekBy(10);
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      setVolume(video.volume + 0.1);
    } else if (event.key === "ArrowDown") {
      event.preventDefault();
      setVolume(video.volume - 0.1);
    } else if (event.key === "m" || event.key === "M") {
      toggleMute();
    } else if (event.key === "f" || event.key === "F") {
      toggleFullscreen();
    } else if (event.key === "Escape") {
      if (!settingsMenu.hidden) {
        settingsMenu.hidden = true;
        settingsBtn.setAttribute("aria-expanded", "false");
        return;
      }
      closePlayer();
    }
  });

  /* ---------- header events ---------- */
  searchForm.addEventListener("submit", function (event) {
    event.preventDefault();
    clearTimeout(state.searchTimer);
    var value = searchInput.value.trim();
    if (value === "") {
      showHome();
      return;
    }
    runSearch(value, { type: "multi", updateHash: true });
  });
  searchInput.addEventListener("input", function () {
    updateSearchClear();
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(function () {
      var value = searchInput.value.trim();
      if (value === "") {
        if (state.view === "search") { showHome(); }
        return;
      }
      if (value.length < 2) { return; }
      runSearch(value, { type: state.search.type || "multi", updateHash: false });
    }, 380);
  });
  searchClear.addEventListener("click", function () {
    setSearchValue("");
    showHome();
    searchInput.focus();
  });

  retryBtn.innerHTML = icon("refresh", { size: 15 }) + " Try again";
  errorClose.innerHTML = icon("x", { size: 15 }) + " Close";
  if (!document.pictureInPictureEnabled) {
    pipBtn.hidden = true;
  }

  window.addEventListener("hashchange", route);
  window.addEventListener("scroll", syncHeader, { passive: true });
  window.addEventListener("resize", function () {
    if (!state.player.open) { return; }
    applyQualityTarget();
    renderSourceMenu();
  });
  document.addEventListener("keydown", function (event) {
    if (state.player.open) { return; }
    var tag = event.target && event.target.tagName;
    var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (event.target && event.target.isContentEditable);
    if (typing) { return; }
    if (event.key === "/") {
      event.preventDefault();
      searchInput.focus();
    }
  });
  applyPrefs();
  updateVolumeUI();
  updatePlayUI();
  route();
  syncHeader();
})();
</script>
</body>
</html>
