  function continueWatchingItems() {
    return Object.keys(state.progress).map(function (key) { return state.progress[key]; }).filter(function (entry) {
      return entry && entry.id && entry.duration > 0 && entry.time > 5;
    }).sort(function (left, right) {
      return (right.updated || 0) - (left.updated || 0);
    }).slice(0, 10).map(function (entry) {
      return {
        id: entry.id,
        mediaType: entry.mediaType,
        title: entry.title,
        poster: entry.poster,
        backdrop: entry.backdrop,
        releaseDate: entry.releaseDate,
        rating: entry.rating,
        season: entry.season,
        episode: entry.episode,
        progress: Math.max(0, Math.min(1, entry.time / entry.duration))
      };
    });
  }

  /* ---------- browse ---------- */
  function browseFiltersFromQuery(query, type) {
    var year = Number(query.get("year"));
    var rating = Number(query.get("minRating"));
    var votes = Number(query.get("minVotes"));
    var sort = query.get("sort") || "";
    var language = query.get("language") || "";
    var allowedSort = (FILTER_SORTS[type] || FILTER_SORTS.movie).some(function (entry) {
      return entry.id === sort;
    });
    var allowedLanguage = FILTER_LANGUAGES.some(function (entry) { return entry.id === language; });
    return {
      year: Number.isInteger(year) && year >= 1888 && year <= 2100 ? year : 0,
      rating: Number.isFinite(rating) && rating > 0 && rating <= 10 ? rating : 0,
      votes: Number.isInteger(votes) && votes > 0 && votes <= 1000000 ? votes : 0,
      sort: allowedSort ? sort : "",
      language: allowedLanguage ? language : ""
    };
  }
  function activeFilterCount(browse) {
    return (browse.year > 0 ? 1 : 0) + (browse.rating > 0 ? 1 : 0) +
      (browse.votes > 0 ? 1 : 0) + (browse.sort ? 1 : 0) + (browse.language ? 1 : 0);
  }
  function browseParams(browse) {
    var params = new URLSearchParams();
    params.set("category", browse.category || "popular");
    if (browse.genre > 0) { params.set("genre", String(browse.genre)); }
    if (browse.year > 0) { params.set("year", String(browse.year)); }
    if (browse.rating > 0) { params.set("minRating", String(browse.rating)); }
    if (browse.votes > 0) { params.set("minVotes", String(browse.votes)); }
    if (browse.sort) { params.set("sort", browse.sort); }
    if (browse.language) { params.set("language", browse.language); }
    return params;
  }
  async function showBrowse(type, category, genre) {
    state.view = "browse";
    state.homeToken += 1;
    state.detailToken += 1;
    stopHeroTimer();
    updateNav(type === "anime" ? "anime" : type);
    setSearchValue("");
    window.scrollTo({ top: 0 });
    syncHeader();
    if (state.browseAbort) {
      state.browseAbort.abort();
    }
    var controller = new AbortController();
    state.browseAbort = controller;

    if (type === "anime") {
      state.browse = { type: "anime", category: "", genre: 16, year: 0, rating: 0, votes: 0, sort: "", language: "", page: 1, items: [], totalPages: 1, anime: true };
      app.innerHTML = '<div class="page"><div class="page-head"><div class="eyebrow">Browse</div><h1>Anime</h1><p>Japanese animation, movies and series.</p></div>' + gridSkeleton() + "</div>";
      var animeResults = await Promise.allSettled([
        api("/api/browse/movie?genre=16&page=1", { signal: controller.signal }),
        api("/api/browse/tv?genre=16&page=1", { signal: controller.signal })
      ]);
      if (controller.signal.aborted || state.view !== "browse") { return; }
      var animeMovies = animeResults[0].status === "fulfilled" ? animeResults[0].value.results || [] : [];
      var animeShows = animeResults[1].status === "fulfilled" ? animeResults[1].value.results || [] : [];
      var items = mergeUnique([animeMovies, animeShows]).filter(function (item) { return item.isAnime; });
      state.browse.items = items;
      renderBrowseView("Anime", items, { anime: true });
      return;
    }

    var allowed = CATEGORIES[type];
    var safeCategory = allowed.some(function (entry) { return entry.id === category; }) ? category : "popular";
    var safeGenre = Number.isInteger(genre) && genre > 0 ? genre : 0;
    var filters = browseFiltersFromQuery(parseRoute().query, type);
    state.browse = { type: type, category: safeCategory, genre: safeGenre, year: filters.year, rating: filters.rating, votes: filters.votes, sort: filters.sort, language: filters.language, page: 1, items: [], totalPages: 1, anime: false };
    app.innerHTML = '<div class="page"><div class="page-head"><div class="eyebrow">Browse</div><h1>' + (type === "movie" ? "Movies" : "TV Shows") + "</h1></div>" + gridSkeleton() + "</div>";
    try {
      var data = await api(browsePath(type, safeCategory, safeGenre, 1, state.browse), { signal: controller.signal });
      if (controller.signal.aborted || state.view !== "browse") { return; }
      state.browse.items = data.results || [];
      state.browse.totalPages = data.totalPages || 1;
      renderBrowseView(type === "movie" ? "Movies" : "TV Shows", state.browse.items);
    } catch (error) {
      if (error.name === "AbortError" || controller.signal.aborted) { return; }
      app.innerHTML = "";
      app.appendChild(errorBox("Could not load " + (type === "movie" ? "movies" : "TV shows"), error.message || "The request failed.", function () { showBrowse(type, category, genre); }));
    }
  }

  function browsePath(type, category, genre, page, browse) {
    browse = browse || state.browse;
    var params = new URLSearchParams();
    params.set("category", category);
    if (genre > 0) { params.set("genre", String(genre)); }
    if (browse.year > 0) { params.set("year", String(browse.year)); }
    if (browse.rating > 0) { params.set("minRating", String(browse.rating)); }
    if (browse.sort) { params.set("sort", browse.sort); }
    if (browse.language) { params.set("language", browse.language); }
    params.set("page", String(page));
    return "/api/browse/" + type + "?" + params.toString();
  }

  function filterSummary(browse) {
    var parts = [];
    if (browse.year > 0) { parts.push(String(browse.year)); }
    if (browse.rating > 0) { parts.push(browse.rating + "+ rating"); }
    if (browse.votes > 0) { parts.push(browse.votes.toLocaleString() + "+ votes"); }
    var sort = (FILTER_SORTS[browse.type] || []).find(function (entry) { return entry.id === browse.sort; });
    if (sort && browse.sort !== "popularity.desc") { parts.push(sort.name); }
    var language = FILTER_LANGUAGES.find(function (entry) { return entry.id === browse.language; });
    if (language && language.id) { parts.push(language.name); }
    return parts.join(" · ");
  }
  function clearBrowseFilters() {
    var params = new URLSearchParams();
    params.set("category", state.browse.category || "popular");
    if (state.browse.genre > 0) { params.set("genre", String(state.browse.genre)); }
    navigate("#/browse/" + state.browse.type + "?" + params.toString());
  }
  function renderFilterBar() {
    var browse = state.browse;
    var count = activeFilterCount(browse);
    var wrap = document.createElement("div");
    wrap.className = "filter-bar";

    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "filter-toggle" + (count > 0 ? " has-filters" : "");
    toggle.innerHTML = icon("settings", { size: 14 }) + " Filters" +
      (count > 0 ? '<span class="filter-count">' + count + "</span>" : "");
    wrap.appendChild(toggle);

    var summary = document.createElement("span");
    summary.className = "filter-active";
    summary.textContent = filterSummary(browse);
    wrap.appendChild(summary);

    if (count > 0) {
      var clear = document.createElement("button");
      clear.type = "button";
      clear.className = "filter-clear";
      clear.textContent = "Clear";
      clear.addEventListener("click", clearBrowseFilters);
      wrap.appendChild(clear);
    }

    var panel = document.createElement("div");
    panel.className = "filter-panel";
    panel.hidden = true;

    function field(label, options, value) {
      var labelEl = document.createElement("label");
      labelEl.className = "filter-field";
      var text = document.createElement("span");
      text.textContent = label;
      var select = document.createElement("select");
      options.forEach(function (option) {
        var item = document.createElement("option");
        item.value = String(option.value);
        item.textContent = option.name;
        if (String(option.value) === String(value)) { item.selected = true; }
        select.appendChild(item);
      });
      labelEl.appendChild(text);
      labelEl.appendChild(select);
      return { label: labelEl, select: select };
    }

    var sortField = field("Sort by", [{ value: "", name: "Default" }].concat((FILTER_SORTS[browse.type] || []).map(function (entry) {
      return { value: entry.id, name: entry.name };
    })), browse.sort);
    var ratingField = field("Minimum rating", FILTER_RATINGS.map(function (entry) {
      return { value: entry.value, name: entry.name };
    }), browse.rating);
    var votesField = field("Minimum votes", FILTER_VOTES, browse.votes);
    var maxYear = new Date().getFullYear() + 1;
    var years = [{ value: 0, name: "Any year" }];
    for (var year = maxYear; year >= 1940; year -= 1) {
      years.push({ value: year, name: String(year) });
    }
    var yearField = field("Release year", years, browse.year);
    var languageField = field("Original language", FILTER_LANGUAGES, browse.language);

    panel.appendChild(sortField.label);
    panel.appendChild(ratingField.label);
    panel.appendChild(votesField.label);
    panel.appendChild(yearField.label);
    panel.appendChild(languageField.label);

    var actions = document.createElement("div");
    actions.className = "filter-actions";
    var reset = document.createElement("button");
    reset.type = "button";
    reset.className = "btn small";
    reset.textContent = "Reset";
    reset.addEventListener("click", clearBrowseFilters);
    var apply = document.createElement("button");
    apply.type = "button";
    apply.className = "btn small primary";
    apply.textContent = "Apply filters";
    apply.addEventListener("click", function () {
      var next = Object.assign({}, browse, {
        sort: sortField.select.value,
        rating: Number(ratingField.select.value) || 0,
        votes: Number(votesField.select.value) || 0,
        year: Number(yearField.select.value) || 0,
        language: languageField.select.value
      });
      navigate("#/browse/" + browse.type + "?" + browseParams(next).toString());
    });
    actions.appendChild(reset);
    actions.appendChild(apply);
    panel.appendChild(actions);
    wrap.appendChild(panel);

    toggle.addEventListener("click", function () {
      panel.hidden = !panel.hidden;
    });

    return wrap;
  }

  function renderBrowseView(title, items, options) {
    options = options || {};
    app.innerHTML = "";
    var page = document.createElement("div");
    page.className = "page";
    var head = document.createElement("div");
    head.className = "browse-hero";
    var genreName = state.browse.genre > 0 ? GENRE_NAMES[state.browse.genre] : "";
    var heading = options.anime ? "Anime" : genreName ? genreName + " " + title : title;
    var first = items[0];
    if (first && (first.backdrop || first.poster)) {
      var bg = document.createElement("img");
      bg.className = "browse-bg";
      bg.alt = "";
      bg.src = first.backdrop || first.poster;
      head.appendChild(bg);
      var shade = document.createElement("div");
      shade.className = "browse-shade";
      head.appendChild(shade);
    }
    var body = document.createElement("div");
    body.className = "browse-hero-body";
    var description = options.anime
      ? "Japanese animation, movies and series, sorted by popularity."
      : genreName
        ? "The most popular " + (state.browse.type === "movie" ? "movies" : "shows") + " in " + genreName + " right now."
        : "Browse " + (state.browse.type === "movie" ? "movies" : "TV shows") + " by category and genre.";
    body.innerHTML = '<div class="eyebrow">Browse' + (state.browse.type === "movie" ? " · Movies" : state.browse.type === "tv" ? " · TV Shows" : " · Anime") + "</div>" +
      "<h1>" + esc(heading) + "</h1><p>" + esc(description) + "</p>" +
      (items.length > 0 ? '<div class="browse-count">' + items.length + " titles on this page" + (state.browse.totalPages > 1 ? " · page " + state.browse.page + " of " + state.browse.totalPages : "") + "</div>" : "");
    head.appendChild(body);

    if (!options.anime) {
      var tabs = document.createElement("div");
      tabs.className = "tabs";
      CATEGORIES[state.browse.type].forEach(function (entry) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "tab" + (entry.id === state.browse.category ? " active" : "");
        button.textContent = entry.name;
        button.addEventListener("click", function () {
          var next = Object.assign({}, state.browse, { category: entry.id });
          navigate("#/browse/" + state.browse.type + "?" + browseParams(next).toString());
        });
        tabs.appendChild(button);
      });
      body.appendChild(tabs);
    }

    if (!options.anime) {
      var chips = document.createElement("div");
      chips.className = "chips";
      GENRES.forEach(function (genre) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "chip" + (genre.id === state.browse.genre ? " active" : "");
        button.textContent = genre.name;
        button.addEventListener("click", function () {
          var next = Object.assign({}, state.browse, { genre: genre.id });
          navigate("#/browse/" + state.browse.type + "?" + browseParams(next).toString());
        });
        chips.appendChild(button);
      });
      body.appendChild(chips);
    }

    page.appendChild(head);
    if (!options.anime) {
      page.appendChild(renderFilterBar());
    }
    if (items.length === 0) {
      var filtered = !options.anime && activeFilterCount(state.browse) > 0;
      page.appendChild(emptyBox(
        filtered ? "No matches for these filters" : "Nothing here yet",
        filtered ? "No titles matched this combination. Clear the filters or try a wider year range." : "No titles matched this category. Try another genre or category.",
        filtered ? "Clear filters" : "Browse popular",
        filtered ? clearBrowseFilters : function () {
          navigate("#/browse/" + (state.browse.type || "movie"));
        }
      ));
      app.appendChild(page);
      return;
    }
    var grid = document.createElement("div");
    grid.className = "grid";
    items.forEach(function (item) { grid.appendChild(card(item)); });
    page.appendChild(grid);

    if (!options.anime && state.browse.page < state.browse.totalPages) {
      var more = document.createElement("div");
      more.className = "load-more";
      var button = document.createElement("button");
      button.type = "button";
      button.className = "btn";
      button.textContent = "Load more";
      button.addEventListener("click", function () { loadMoreBrowse(button); });
      more.appendChild(button);
      page.appendChild(more);
    }
    app.appendChild(page);
  }

  async function loadMoreBrowse(button) {
    button.disabled = true;
    button.textContent = "Loading…";
    var nextPage = state.browse.page + 1;
    try {
      var data = await api(browsePath(state.browse.type, state.browse.category, state.browse.genre, nextPage, state.browse));
      state.browse.page = nextPage;
      state.browse.totalPages = data.totalPages || state.browse.totalPages;
      var grid = app.querySelector(".grid");
      (data.results || []).forEach(function (item) {
        if (grid) { grid.appendChild(card(item)); }
        state.browse.items.push(item);
      });
      if (state.browse.page >= state.browse.totalPages) {
        button.parentElement.remove();
      } else {
        button.disabled = false;
        button.textContent = "Load more";
      }
    } catch (error) {
      button.disabled = false;
      button.textContent = "Load more";
      toast(error.message || "Could not load more titles.");
    }
  }

  /* ---------- search ---------- */
  function runSearch(query, options) {
    options = options || {};
    var clean = String(query || "").trim();
    if (clean === "") {
      showHome();
      return;
    }
    state.view = "search";
    state.homeToken += 1;
    state.detailToken += 1;
    stopHeroTimer();
    updateNav("");
    setSearchValue(clean);
    window.scrollTo({ top: 0 });
    syncHeader();
    var type = options.type === "movie" || options.type === "tv" ? options.type : "multi";
    state.search = { query: clean, type: type, page: 1, items: [], totalPages: 1 };
    if (options.updateHash) {
      var hash = "#/search?q=" + encodeURIComponent(clean) + "&type=" + type;
      if (location.hash !== hash) {
        history.pushState(null, "", hash);
      }
    }
    if (state.searchAbort) {
      state.searchAbort.abort();
    }
    var controller = new AbortController();
    state.searchAbort = controller;
    renderSearchShell(clean, type);
    api("/api/search/" + type + "?query=" + encodeURIComponent(clean) + "&page=1", { signal: controller.signal }).then(function (data) {
      if (controller.signal.aborted || state.view !== "search") { return; }
      state.search.items = data.results || [];
      state.search.totalPages = data.totalPages || 1;
      renderSearchResults(clean, type);
    }).catch(function (error) {
      if (error.name === "AbortError" || controller.signal.aborted) { return; }
      app.innerHTML = "";
      app.appendChild(errorBox("Search failed", error.message || "The search request failed.", function () { runSearch(clean, { type: type, updateHash: false }); }));
    });
  }

  function renderSearchShell(query, type) {
    app.innerHTML = "";
    var page = document.createElement("div");
    page.className = "page";
    var head = document.createElement("div");
    head.className = "page-head";
    head.innerHTML = '<div class="eyebrow">Search</div><h1>Results for “' + esc(query) + '”</h1>';
    var tabs = document.createElement("div");
    tabs.className = "tabs";
    [["multi", "All"], ["movie", "Movies"], ["tv", "TV Shows"]].forEach(function (entry) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "tab" + (entry[0] === type ? " active" : "");
      button.textContent = entry[1];
      button.addEventListener("click", function () {
        runSearch(query, { type: entry[0], updateHash: true });
      });
      tabs.appendChild(button);
    });
    head.appendChild(tabs);
    var count = document.createElement("div");
    count.className = "browse-count";
    count.id = "search-count";
    count.textContent = "Searching…";
    head.appendChild(count);
    page.appendChild(head);
    var body = document.createElement("div");
    body.id = "search-body";
    body.innerHTML = gridSkeleton();
    page.appendChild(body);
    app.appendChild(page);
  }

  function renderSearchResults(query, type) {
    var page = app.querySelector(".page");
    var body = document.getElementById("search-body");
    if (!page || !body) { return; }
    body.innerHTML = "";
    if (state.search.items.length === 0) {
      body.appendChild(emptyBox("No matches", "Nothing matched “" + query + "”. Try a shorter title or switch between movies and TV.", "Clear search", function () {
        setSearchValue("");
        showHome();
      }));
      return;
    }
    var count = document.getElementById("search-count");
    if (count) {
      count.textContent = state.search.items.length + " titles on this page" +
        (state.search.totalPages > 1 ? " · page " + state.search.page + " of " + state.search.totalPages : "");
    }
    var grid = document.createElement("div");
    grid.className = "grid";
    state.search.items.forEach(function (item) { grid.appendChild(card(item)); });
    body.appendChild(grid);
    if (state.search.page < state.search.totalPages) {
      var more = document.createElement("div");
      more.className = "load-more";
      var button = document.createElement("button");
      button.type = "button";
      button.className = "btn";
      button.textContent = "Load more";
      button.addEventListener("click", function () { loadMoreSearch(button); });
      more.appendChild(button);
      body.appendChild(more);
    }
  }

  async function loadMoreSearch(button) {
    button.disabled = true;
    button.textContent = "Loading…";
    var nextPage = state.search.page + 1;
    try {
      var data = await api("/api/search/" + state.search.type + "?query=" + encodeURIComponent(state.search.query) + "&page=" + nextPage);
      state.search.page = nextPage;
      state.search.totalPages = data.totalPages || state.search.totalPages;
      var grid = app.querySelector("#search-body .grid");
      (data.results || []).forEach(function (item) {
        if (grid) { grid.appendChild(card(item)); }
        state.search.items.push(item);
      });
      var count = document.getElementById("search-count");
      if (count) {
        count.textContent = state.search.items.length + " titles loaded" +
          (state.search.totalPages > 1 ? " · page " + state.search.page + " of " + state.search.totalPages : "");
      }
      if (state.search.page >= state.search.totalPages) {
        button.parentElement.remove();
      } else {
        button.disabled = false;
        button.textContent = "Load more";
      }
    } catch (error) {
      button.disabled = false;
      button.textContent = "Load more";
      toast(error.message || "Could not load more results.");
    }
  }

  /* ---------- detail ---------- */
  async function openDetail(item, query) {
    state.view = "detail";
    state.homeToken += 1;
    state.detailToken += 1;
    var token = state.detailToken;
    stopHeroTimer();
    updateNav(item.mediaType);
    setSearchValue("");
    window.scrollTo({ top: 0 });
    syncHeader();
    state.detail = null;
    state.seasonData = null;
    state.season = 1;
    state.episode = 1;
    state.detailSources = [];
    state.detailSourcesKey = "";
    app.innerHTML = '<div class="detail-wrap"><div class="skeleton skeleton-hero" style="min-height:420px"></div></div>';

    var detailPath = item.mediaType === "tv" ? "/api/tv/" + item.id : "/api/movie/" + item.id;
    try {
      var detail = await api(detailPath);
      if (token !== state.detailToken || state.view !== "detail") { return; }
      state.detail = detail;
      if (detail.mediaType === "tv") {
        var wantedSeason = Number(query && query.get("season")) || 1;
        var maxSeason = Math.max(1, Number(detail.seasons) || 1);
        state.season = Math.min(Math.max(1, wantedSeason), maxSeason);
        try {
          state.seasonData = await api("/api/tv/" + detail.id + "/season/" + state.season);
        } catch (seasonError) {
          state.seasonData = { id: detail.id, season: state.season, name: "Season " + state.season, overview: "", poster: "", airDate: "", episodes: [] };
        }
        if (token !== state.detailToken || state.view !== "detail") { return; }
        var wantedEpisode = Number(query && query.get("episode")) || 0;
        var episodes = state.seasonData.episodes || [];
        state.episode = episodes.some(function (entry) { return entry.number === wantedEpisode; })
          ? wantedEpisode
          : (episodes[0] ? episodes[0].number : 1);
      }
      renderDetail();
    } catch (error) {
      if (token !== state.detailToken || state.view !== "detail") { return; }
      app.innerHTML = "";
      app.appendChild(errorBox("Could not load this title", error.message || "The request failed.", function () { openDetail(item, query); }));
    }
  }

  function renderDetail() {
    var detail = state.detail;
    if (!detail) { return; }
    var token = state.detailToken;
    app.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "detail-wrap";

    var back = document.createElement("button");
    back.type = "button";
    back.className = "back-btn";
    back.innerHTML = icon("arrowLeft", { size: 14 }) + " Back";
    back.addEventListener("click", function () {
      if (history.length > 1) { history.back(); } else { navigate("#/"); }
    });
    wrap.appendChild(back);

    var hero = document.createElement("section");
    hero.className = "detail-hero";
    var heroImage = detail.backdrop || detail.poster;
    var meta = [];
    if (yearOf(detail)) { meta.push("<span>" + esc(yearOf(detail)) + "</span>"); }
    if (ratingOf(detail)) { meta.push('<span class="rating">' + icon("star", { fill: true, size: 10 }) + " " + esc(ratingOf(detail)) + "</span>"); }
    if (detail.mediaType === "tv") {
      if (detail.seasons) { meta.push("<span>" + detail.seasons + " season" + (detail.seasons === 1 ? "" : "s") + "</span>"); }
      if (detail.runtime) { meta.push("<span>" + detail.runtime + " min/ep</span>"); }
    } else if (detail.runtime) {
      meta.push("<span>" + detail.runtime + " min</span>");
    }
    if (detail.certification) { meta.push("<span>" + esc(detail.certification) + "</span>"); }
    meta.push("<span>" + esc(typeLabel(detail)) + "</span>");

    var genres = (detail.genres || []).map(function (genre) {
      var id = GENRE_IDS[String(genre).toLowerCase()];
      return id
        ? '<button class="genre-pill" type="button" data-genre="' + id + '">' + esc(genre) + "</button>"
        : '<span class="genre-pill">' + esc(genre) + "</span>";
    }).join("");
    var credits = [];
    if (detail.cast && detail.cast.length > 0) {
      credits.push("<div><b>Cast</b> " + esc(detail.cast.slice(0, 6).join(", ")) + "</div>");
    }
    if (detail.director) {
      credits.push("<div><b>" + (detail.mediaType === "tv" ? "Created by" : "Directed by") + "</b> " + esc(detail.director) + "</div>");
    }

    hero.innerHTML =
      (heroImage ? '<img class="detail-bg" src="' + esc(heroImage) + '" alt="">' : "") +
      '<div class="detail-shade"></div>' +
      '<div class="detail-content">' +
        '<div class="detail-poster">' + (detail.poster ? '<img src="' + esc(detail.poster) + '" alt="">' : '<div class="poster-fallback">' + esc(String(detail.title).slice(0, 1)) + "</div>") + "</div>" +
        '<div class="detail-info">' +
          '<div class="eyebrow">' + esc(typeLabel(detail)) + (yearOf(detail) ? " · " + esc(yearOf(detail)) : "") + "</div>" +
          "<h1>" + esc(detail.title) + "</h1>" +
          '<div class="detail-meta">' + metaRow(meta) + "</div>" +
          (genres ? '<div class="detail-genres">' + genres + "</div>" : "") +
          (detail.tagline ? '<p class="tagline">“' + esc(detail.tagline) + '”</p>' : "") +
          '<p class="detail-overview">' + esc(detail.overview || "No overview available.") + "</p>" +
          '<div class="detail-actions">' +
            '<button class="btn primary" id="detail-play" type="button">' + icon("play", { fill: true, size: 15 }) + " Play</button>" +
            (detail.trailer ? '<a class="btn ghost" href="https://www.youtube.com/watch?v=' + encodeURIComponent(detail.trailer) + '" target="_blank" rel="noopener noreferrer">' + icon("clapperboard", { size: 15 }) + " Trailer</a>" : "") +
            '<button class="btn ghost" id="detail-sources" type="button">' + icon("settings", { size: 15 }) + " Sources</button>" +
          "</div>" +
          (credits.length > 0 ? '<div class="detail-credits">' + credits.join("") + "</div>" : "") +
        "</div>" +
      "</div>";
    wrap.appendChild(hero);

    var body = document.createElement("div");
    body.className = "detail-body";
    if (detail.mediaType === "tv") {
      body.appendChild(renderTvControls());
      body.appendChild(renderEpisodeList());
    }
    body.appendChild(renderSourcePanel());
    wrap.appendChild(body);

    document.getElementById("detail-play").addEventListener("click", function () {

    });
    document.getElementById("detail-sources").addEventListener("click", function () {

      if (panel) {
        panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
        findSourcesForDetail();
      }
    });
    document.querySelectorAll("[data-genre]").forEach(function (button) {
      button.addEventListener("click", function () {
        navigate("#/browse/" + detail.mediaType + "?genre=" + button.getAttribute("data-genre"));
      });
    });
    updateDetailPlayLabel();
    loadMoreLikeThis(token);
  }

  function renderTvControls() {
    var detail = state.detail;
    var seasonData = state.seasonData || { episodes: [] };
    var episodes = seasonData.episodes || [];
    var controls = document.createElement("div");
    controls.className = "tv-controls";
    var seasonOptions = "";
    for (var season = 1; season <= Math.max(1, detail.seasons || 1); season += 1) {
      seasonOptions += '<option value="' + season + '"' + (season === state.season ? " selected" : "") + ">Season " + season + "</option>";
    }
    var episodeOptions = episodes.map(function (episode) {
      return '<option value="' + episode.number + '"' + (episode.number === state.episode ? " selected" : "") + ">E" + String(episode.number).padStart(2, "0") + " · " + esc(episode.name) + "</option>";
    }).join("");
    var current = episodes.find(function (episode) { return episode.number === state.episode; });
    controls.innerHTML =
      '<label class="select-wrap">Season <select id="season-select">' + seasonOptions + "</select></label>" +
      '<label class="select-wrap">Episode <select id="episode-select"' + (episodes.length === 0 ? " disabled" : "") + ">" + (episodeOptions || '<option value="1">No episodes</option>') + "</select></label>" +
      '<div class="episode-now">' + (current ? esc(current.name) + (current.runtime ? " · " + current.runtime + " min" : "") : "Select an episode") + "</div>";
    var seasonSelect = controls.querySelector("#season-select");
    seasonSelect.addEventListener("change", function () {
      loadSeason(Number(seasonSelect.value));
    });
    var episodeSelect = controls.querySelector("#episode-select");
    if (episodeSelect) {
      episodeSelect.addEventListener("change", function () {
        selectEpisode(Number(episodeSelect.value));
      });
    }
    return controls;
  }

  function renderEpisodeList() {
    var detail = state.detail;
    var seasonData = state.seasonData || { episodes: [] };
    var list = document.createElement("div");
    list.className = "episode-list";
    if (!seasonData.episodes || seasonData.episodes.length === 0) {
      list.innerHTML = '<div class="source-empty">No episodes were returned for this season.</div>';
      return list;
    }
    seasonData.episodes.forEach(function (episode) {
      var row = document.createElement("button");
      row.type = "button";
      row.className = "episode-row" + (episode.number === state.episode ? " active" : "");
      row.setAttribute("data-episode", String(episode.number));
      row.innerHTML =
        '<div class="episode-still">' + (episode.still ? '<img loading="lazy" src="' + esc(episode.still) + '" alt="">' : "") + "</div>" +
        '<div class="episode-info">' +
          "<strong><span class=\"num\">E" + String(episode.number).padStart(2, "0") + "</span>" + esc(episode.name) + "</strong>" +
          (episode.overview ? "<p>" + esc(episode.overview) + "</p>" : "") +
          '<div class="episode-meta">' + esc([episode.airDate, episode.runtime ? episode.runtime + " min" : ""].filter(Boolean).join(" · ")) + "</div>" +
        "</div>" +
        '<span class="episode-play" aria-hidden="true">' + icon("play", { fill: true, size: 14 }) + "</span>";
      row.addEventListener("click", function (event) {
        selectEpisode(episode.number);
        if (event.target.closest(".episode-play") || event.detail === 1) {

  function renderSourcePanel() {
    var panel = document.createElement("section");
    panel.className = "source-panel";
    panel.id = "source-panel";
    var waitOptions = WAITS.map(function (value) {
      return '<option value="' + value + '"' + (value === state.wait ? " selected" : "") + ">" + value / 1000 + "s</option>";
    }).join("");
    panel.innerHTML =
      '<div class="source-head">' +
        "<h3>Sources</h3>" +
        '<span class="muted">Auto picks the best 1080p/HLS mirror.</span>' +
        '<span class="spacer"></span>' +
        '<label class="select-wrap">Wait <select id="wait-select">' + waitOptions + "</select></label>" +
        '<button class="btn small" id="find-sources" type="button">' + icon("refresh", { size: 14 }) + " Find sources</button>" +
      "</div>" +
      '<div class="source-list" id="source-list"><div class="source-empty">Press “Find sources”, or just press Play to let the auto picker choose.</div></div>';
    panel.querySelector("#wait-select").addEventListener("change", function (event) {
      state.wait = Number(event.target.value) || 8000;
      try { localStorage.setItem(WAIT_KEY, String(state.wait)); } catch (error) { /* ignore */ }
      toast("Wait budget set to " + state.wait / 1000 + "s");
    });
    panel.querySelector("#find-sources").addEventListener("click", function () { findSourcesForDetail(); });
    return panel;
  }

  function updateDetailPlayLabel() {
    var button = document.getElementById("detail-play");
    if (!button || !state.detail) { return; }
    var entry = state.progress[progressKey(state.detail.mediaType, state.detail.id, state.season, state.episode)];
    if (entry && entry.time > 5) {
      button.innerHTML = icon("play", { fill: true, size: 15 }) + " Resume " + formatTime(entry.time);
    } else {
      button.innerHTML = icon("play", { fill: true, size: 15 }) + " Play";
    }
  }

  async function loadSeason(season) {
    if (!state.detail || state.detail.mediaType !== "tv") { return; }
    state.season = season;
    state.episode = 1;
    state.detailSources = [];
    state.detailSourcesKey = "";
    state.detailStats = null;
    try {
      state.seasonData = await api("/api/tv/" + state.detail.id + "/season/" + season);
      var episodes = state.seasonData.episodes || [];
      if (episodes[0]) { state.episode = episodes[0].number; }
    } catch (error) {
      state.seasonData = { id: state.detail.id, season: season, name: "Season " + season, overview: "", poster: "", airDate: "", episodes: [] };
      toast(error.message || "Could not load this season.");
    }
    renderDetail();
  }

  function selectEpisode(number) {
    state.episode = number;
    var select = document.getElementById("episode-select");
    if (select) { select.value = String(number); }
    document.querySelectorAll(".episode-row").forEach(function (row) {
      row.classList.toggle("active", Number(row.getAttribute("data-episode")) === number);
    });
    var current = (state.seasonData && state.seasonData.episodes || []).find(function (episode) { return episode.number === number; });
    var now = document.querySelector(".episode-now");
    if (now && current) {
      now.textContent = current.name + (current.runtime ? " · " + current.runtime + " min" : "");
    }
    state.detailSources = [];
    state.detailSourcesKey = "";
    var list = document.getElementById("source-list");
    if (list) {
      list.innerHTML = '<div class="source-empty">Press “Find sources”, or just press Play to let the auto picker choose.</div>';
    }
    updateDetailPlayLabel();
  }

  async function findSourcesForDetail() {
    if (!state.detail) { return; }
    var detail = state.detail;
    var key = sourceKey(detail, state.season, state.episode);
    if (state.detailSourcesKey === key && state.detailSources.length > 0) {
      renderDetailSources();
      return;
    }
    var list = document.getElementById("source-list");
    var button = document.getElementById("find-sources");
    var answered = 0;
    var total = 0;
    function onProgress(progress) {
      answered = progress.answered;
      total = progress.total;
      if (list) {
        list.innerHTML =
          '<div class="source-empty">Trying ' + progress.answered + " of " +
          (progress.total > 0 ? progress.total : "?") + " providers… " +
          progress.found + (progress.found === 1 ? " source" : " sources") + " found</div>";
      }
    }
    if (list) { list.innerHTML = '<div class="source-empty">Resolving sources… this can take a few seconds.</div>'; }
    if (button) { button.disabled = true; button.textContent = "Resolving…"; }
    try {
      var result = await fetchSources(detail, state.season, state.episode, undefined, onProgress);
      state.detailSources = result.sources;
      state.detailSourcesKey = key;
      state.detailStats = {
        answered: result.answered || answered,
        total: result.total || total,
        found: result.sources.length
      };
      renderDetailSources();
      if (result.sources.length === 0) {
        toast("No playable source was found. Raise the wait budget and try again.");
      }
    } catch (error) {
      if (list) {
        list.innerHTML = "";
        list.appendChild(errorBox("Could not resolve sources", error.message || "The request failed.", findSourcesForDetail));
      }
    } finally {
      if (button) { button.disabled = false; button.innerHTML = icon("refresh", { size: 14 }) + " Find sources"; }
    }
  }

  function renderDetailSources() {
    var list = document.getElementById("source-list");
    if (!list) { return; }
    if (state.detailSources.length === 0) {
      list.innerHTML = '<div class="source-empty">No playable source was found. Raise the wait budget and try again.</div>';
      return;
    }
    list.innerHTML = "";
    if (state.detailStats) {
      var stats = document.createElement("div");
      stats.className = "source-stats";
      stats.textContent =
        state.detailStats.found + (state.detailStats.found === 1 ? " source" : " sources") +
        " from " + state.detailStats.answered + " of " + state.detailStats.total + " providers";
      list.appendChild(stats);
    }
    var auto = document.createElement("div");
    auto.className = "source-row";
    auto.innerHTML = '<span class="source-provider">' + icon("sparkles", { size: 13 }) + ' auto</span><span class="source-label">Best available</span><span class="source-type">picker</span><span class="spacer"></span><button class="btn small primary" type="button">' + icon("play", { fill: true, size: 13 }) + " Play</button>";
    auto.querySelector("button").addEventListener("click", function () {
      var index = pickBestSource(state.detailSources, state.detail);
      if (index >= 0) { openPlayerWithSources(state.detail, state.seasonData, state.season, state.episode, state.detailSources, index, { auto: true }); }
    });
    list.appendChild(auto);
    state.detailSources.forEach(function (source, index) {
      var row = document.createElement("div");
      row.className = "source-row";
      row.innerHTML =
        '<span class="source-provider">' + esc(source.provider) + "</span>" +
        '<span class="source-label">' + esc(source.label || ("Source " + (index + 1))) + "</span>" +
        '<span class="source-type">' + esc(source.type || "file") + "</span>" +
        '<span class="spacer"></span>' +
        '<button class="btn small" type="button">' + icon("play", { fill: true, size: 13 }) + " Play</button>";
      row.querySelector("button").addEventListener("click", function () {
        openPlayerWithSources(state.detail, state.seasonData, state.season, state.episode, state.detailSources, index, { auto: false });
      });
      list.appendChild(row);
    });
  }

  async function loadMoreLikeThis(token) {
    var detail = state.detail;
    if (!detail || !detail.genreIds || detail.genreIds.length === 0) { return; }
    try {
      var data = await api("/api/browse/" + detail.mediaType + "?genre=" + detail.genreIds[0] + "&page=1");
      if (token !== state.detailToken || state.view !== "detail" || !state.detail) { return; }
      var items = (data.results || []).filter(function (item) {
        return !(item.id === detail.id && item.mediaType === detail.mediaType);
      }).slice(0, 12);
      if (items.length === 0) { return; }
      var row = renderRow("More like this", items);
      if (row) {
        var wrap = app.querySelector(".detail-wrap");
        if (wrap) { wrap.appendChild(row); }
      }
    } catch (error) {
      /* related titles are optional */
    }
  }

  /* ---------- playback ---------- */
  async function playItem(item, season, episode) {
    try {
      var detail = await fetchDetail(item);
      var targetSeason = season || 1;
      var targetEpisode = episode || 1;
      var seasonData = null;
      if (detail.mediaType === "tv") {
        seasonData = await api("/api/tv/" + detail.id + "/season/" + targetSeason);
        var episodes = seasonData.episodes || [];
        if (!episodes.some(function (entry) { return entry.number === targetEpisode; }) && episodes[0]) {
          targetEpisode = episodes[0].number;
        }
      }
      startPlayback(detail, seasonData, targetSeason, targetEpisode, { auto: true });
    } catch (error) {
      toast(error.message || "Could not start playback.");
    }
  }

  async function fetchDetail(item) {
    return item.mediaType === "tv" ? api("/api/tv/" + item.id) : api("/api/movie/" + item.id);
  }

  function playDetail() {
    if (!state.detail) { return; }
    startPlayback(state.detail, state.seasonData, state.season, state.episode, { auto: true });
  }

  function playEpisode(number) {
    if (!state.detail) { return; }
    selectEpisode(number);
    startPlayback(state.detail, state.seasonData, state.season, number, { auto: true });
  }

  async function startPlayback(detail, seasonData, season, episode, options) {
    options = options || {};
    openPlayer();
    var requestId = ++state.player.requestId;
    if (state.player.abort) { state.player.abort.abort(); }
    var controller = new AbortController();
    state.player.abort = controller;
    state.player.context = { detail: detail, seasonData: seasonData, season: season, episode: episode };
    state.player.sources = [];
    state.player.tried = [];
    state.player.sourceIndex = -1;
    state.player.source = null;
    state.player.auto = options.auto !== false;
    state.player.resumeTime = options.resumeTime || savedProgressTime(detail, season, episode);
    hideError();
    hideNextCard();
    updatePlayerHeader();
    showLoading("Finding sources…");
    renderSourceMenu();

    // The resolver answers one provider at a time, so the line counts up as it
    // goes instead of sitting on a bare spinner for eight seconds.
    function onProgress(progress) {
      if (requestId !== state.player.requestId) { return; }
      var total = progress.total > 0 ? progress.total : "?";
      showLoading(
        "Trying " + progress.answered + " of " + total + " providers… " +
        progress.found + (progress.found === 1 ? " source" : " sources") + " found"
      );
    }

    var key = sourceKey(detail, season, episode);
    var sources = state.detailSourcesKey === key && state.detailSources.length > 0 ? state.detailSources : [];
    try {
      if (sources.length === 0) {
        var result = await fetchSources(detail, season, episode, controller.signal, onProgress);
        if (!state.player.open || requestId !== state.player.requestId) { return; }
        sources = result.sources;
        state.player.sourceStats = { answered: result.answered || 0, total: result.total || 0, found: sources.length };
        state.detailSources = sources;
        state.detailSourcesKey = key;
        renderDetailSources();
      }
      if (sources.length === 0) {
        throw new Error("No playable source was found. Try another title or raise the wait budget.");
      }
      state.player.sources = sources;
      var index = pickBestSource(sources, detail);
      if (index < 0) {
        throw new Error("The providers returned no playable URL.");
      }
      loadSource(sources[index], sources, index, state.player.auto);
    } catch (error) {
      if (error.name === "AbortError" || requestId !== state.player.requestId || !state.player.open) { return; }
      showError("No source found", error.message || "The source request failed.");
    }
  }

  // Public watch pages, no key and no backend. Used when the local resolver is
  // absent - a static deploy has no /api/stream - so the app still plays.
  function embedSources(detail, season, episode) {
    var id = detail.id;
    var list = [];
    if (detail.mediaType === "tv") {
      list.push({
        provider: "vidsrc",
        label: "VidSrc",
        url: "https://vidsrc.to/embed/tv/" + id + "/" + season + "/" + episode,
        type: "embed",
        height: 0
      });
      list.push({
        provider: "2embed",
        label: "2Embed",
        url: "https://www.2embed.cc/embedtv/" + id + "&s=" + season + "&e=" + episode,
        type: "embed",
        height: 0
      });
      list.push({
        provider: "embed.su",
        label: "Embed.su",
        url: "https://embed.su/embed/tv/" + id + "/" + season + "/" + episode,
        type: "embed",
        height: 0
      });
    } else {
      list.push({
        provider: "vidsrc",
        label: "VidSrc",
        url: "https://vidsrc.to/embed/movie/" + id,
        type: "embed",
        height: 0
      });
      list.push({
        provider: "2embed",
        label: "2Embed",
        url: "https://www.2embed.cc/embed/" + id,
        type: "embed",
        height: 0
      });
      list.push({
        provider: "embed.su",
        label: "Embed.su",
        url: "https://embed.su/embed/movie/" + id,
        type: "embed",
        height: 0
      });
    }
    return list;
  }

  // Provider roster, fetched once. Only used to answer "how many are being
  // tried", so a failed lookup just leaves the total unknown.
  function providerTotal(signal) {
    if (state.player.providers.length > 0) { return Promise.resolve(state.player.providers.length); }
    return fetch("/api/sources", { headers: { accept: "application/json" }, signal: signal })
      .then(function (response) { return response.ok ? response.json() : null; })
      .then(function (body) {
        var list = (body && body.providers) || [];
        state.player.providers = list;
        return list.length;
      })
      .catch(function () { return 0; });
  }

  function readNdjson(stream, onLine) {
    var reader = stream.getReader();
    var decoder = new TextDecoder();
    var buffer = "";
    function pump() {
      return reader.read().then(function (chunk) {
        if (chunk.done) {
          if (buffer.trim()) { onLine(buffer); }
          return;
        }
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split("\n");
        buffer = lines.pop();
        lines.forEach(function (line) {
          if (line.trim()) { onLine(line); }
        });
        return pump();
      });
    }
    return pump();
  }

  // Resolution streams one line per provider, so the count on screen is the
  // real one rather than a spinner pretending to progress.
  function fetchSources(detail, season, episode, signal, onProgress) {
    var path = detail.mediaType === "tv"
      ? "/api/stream/tv/" + detail.id + "/" + season + "/" + episode
      : "/api/stream/movie/" + detail.id;
    var url = new URL(path, location.origin);
    url.searchParams.set("wait", String(state.wait));
    url.searchParams.set("format", "ndjson");

    var found = [];
    var answered = 0;
    var total = 0;

    function report() {
      if (onProgress) {
        onProgress({ answered: answered, total: total, found: found.length });
      }
    }

    return providerTotal(signal)
      .then(function (count) {
        total = count;
        report();
        return fetch(url.href, {
          headers: { accept: "application/x-ndjson" },
          signal: signal
        });
      })
      .then(function (response) {
        if (!response.ok || !response.body) { throw new Error("No stream endpoint."); }
        return readNdjson(response.body, function (line) {
          var entry;
          try { entry = JSON.parse(line); } catch (error) { return; }
          if (entry.done || entry.error) { return; }
          answered += 1;
          (entry.sources || []).forEach(function (source) {
            if (source && source.url) { found.push(source); }
          });
          report();
        }).then(function () {
          return { sources: found, answered: answered, total: total };
        });
      })
      .then(function (result) {
        if (result.sources.length > 0) { return result; }
        var embeds = embedSources(detail, season, episode);
        return { sources: embeds, answered: 0, total: embeds.length };
      })
      .catch(function (error) {
        if (signal && signal.aborted) throw error;
        var embeds = embedSources(detail, season, episode);
        return { sources: embeds, answered: 0, total: embeds.length };
      });
  }

  // A remembered pick wins over the score, because the score only knows what a
  // provider claims. What actually played last time is better evidence than
  // any label, and a provider that dropped one mirror often still holds others.
  function rememberedSource(detail) {
    if (!detail) { return null; }
    return (prefs.sourcePick || {})[detailKey(detail)] || null;
  }

  function rememberSource(detail, source) {
    if (!detail || !source || !source.provider) { return; }
    prefs.sourcePick = prefs.sourcePick || {};
    prefs.sourcePick[detailKey(detail)] = {
      provider: source.provider,
      label: source.label || ""
    };
    var keys = Object.keys(prefs.sourcePick);
    if (keys.length > 200) {
      keys.slice(0, keys.length - 200).forEach(function (key) { delete prefs.sourcePick[key]; });
    }
    savePrefs();
  }

  function pickBestSource(sources, detail) {
    if (!sources || sources.length === 0) { return -1; }
    var remembered = rememberedSource(detail);
    if (remembered) {
      var exact = -1;
      var sameProvider = -1;
      sources.forEach(function (source, index) {
        if (!source || !source.url) { return; }
        if (source.provider !== remembered.provider) { return; }
        if (sameProvider < 0) { sameProvider = index; }
        if (source.label === remembered.label) { exact = index; }
      });
      if (exact >= 0) { return exact; }
      if (sameProvider >= 0) { return sameProvider; }
    }
    var scored = sources.map(function (source, index) {
      var height = Math.min(Number(source.height) || 0, 1080);
      var hls = source.type === "hls" || /\.m3u8(\?|$)/i.test(source.url || "") ? 1 : 0;
      return { index: index, score: height * 10 + hls };
    }).filter(function (entry) { return sources[entry.index] && sources[entry.index].url; });
    if (scored.length === 0) { return -1; }
    scored.sort(function (left, right) { return right.score - left.score; });
    return scored[0].index;
  }

  function savedProgressTime(detail, season, episode) {
    var entry = state.progress[progressKey(detail.mediaType, detail.id, season, episode)];
    return entry && entry.time > 5 ? entry.time : 0;
  }

  function openPlayer() {
    playerEl.dataset.open = "true";
    playerEl.setAttribute("aria-hidden", "false");
    document.body.classList.add("player-open");
    state.player.open = true;
    applyPrefs();
    setVolume(prefs.volume / 100);
    showControls();
  }

  function openPlayerWithSources(detail, seasonData, season, episode, sources, index, options) {
    options = options || {};
    openPlayer();
    state.player.requestId += 1;
    if (state.player.abort) { state.player.abort.abort(); }
    state.player.context = { detail: detail, seasonData: seasonData, season: season, episode: episode };
    state.player.sources = sources;
    state.player.tried = [];
    state.player.sourceIndex = index;
    state.player.source = sources[index] || null;
    state.player.auto = options.auto !== false;
    state.player.resumeTime = options.resumeTime || savedProgressTime(detail, season, episode);
    hideError();
    hideNextCard();
    updatePlayerHeader();
    renderSourceMenu();
    if (sources[index]) {
      loadSource(sources[index], sources, index, state.player.auto);
    } else {
      showError("No source found", "This provider did not return a playable URL.");
    }
  }

  function closePlayer() {
    if (!state.player.open) { return; }
    saveProgress();
    state.player.requestId += 1;
    if (state.player.abort) {
      state.player.abort.abort();
      state.player.abort = null;
    }
    video.pause();
    hideEmbed();
    destroyHls();
    video.removeAttribute("src");
    video.load();
    playerEl.dataset.open = "false";
    playerEl.setAttribute("aria-hidden", "true");
    document.body.classList.remove("player-open");
    state.player.open = false;
    state.player.context = null;
    state.player.sources = [];
    state.player.sourceIndex = -1;
    state.player.source = null;
    hideError();
    hideNextCard();
    hideLoading();
    hideSkipIntro();
    settingsMenu.hidden = true;
    state.player.sheet = "";
    clearSleepTimer();
    settingsBtn.setAttribute("aria-expanded", "false");
    clearTimeout(state.player.hideTimer);
    playerEl.classList.remove("idle");
  }

  function loadSource(source, sources, index, auto) {
    if (!source) { return; }
    var previousTime = Number.isFinite(video.currentTime) && video.currentTime > 5 ? video.currentTime : 0;
    state.player.sources = sources;
    state.player.sourceIndex = index;
    state.player.source = source;
    rememberSource(state.player.context && state.player.context.detail, source);
    if (state.player.tried.indexOf(index) < 0) { state.player.tried.push(index); }
    state.player.auto = auto !== false;
    state.player.recovered = false;
    if (previousTime > 0) {
      state.player.resumeTime = previousTime;
    }
    hideError();
    hideNextCard();
    hideSkipIntro();
    state.player.qualityTarget = 0;
    state.player.qualityOptions = [];
    removeExternalTracks();
    state.player.subtitles = [];
    state.player.subtitleIndex = -1;
    state.player.subtitleSource = "";
    state.player.captionsOff = false;
    state.player.audioTracks = [];
    state.player.audioIndex = -1;
    updatePlayerHeader();
    renderSourceMenu();
    showLoading("Loading " + (source.label || source.provider || "source") + "…");

    destroyHls();
    video.pause();
    video.removeAttribute("src");
    video.load();

    if (source.type === "embed") {
      showEmbed(source.url);
      return;
    }
    hideEmbed();

    var url = source.url;
    var proxyParams = new URLSearchParams({ url: source.url });
    if (source.headers && Object.keys(source.headers).length > 0) {
      proxyParams.set("headers", JSON.stringify(source.headers));
    }
    if (source.query && Object.keys(source.query).length > 0) {
      proxyParams.set("query", JSON.stringify(source.query));
    }
    if (proxyParams.has("headers") || proxyParams.has("query")) {
      url = "/api/proxy?" + proxyParams.toString();
    }
    var isHls = source.type === "hls" || /\.m3u8(\?|$)/i.test(source.url || "");
    if (isHls) {
      if (window.Hls && window.Hls.isSupported()) {
        var hls = new window.Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, enableWorker: true });
        state.player.hls = hls;
        hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
          if (state.player.hls !== hls) { return; }
          state.player.qualityOptions = hlsQualityOptions(hls);
          applyQualityTarget();
          syncSubtitleTracks();
          syncAudioTracks();
          if (!settingsMenu.hidden) { renderSettingsMenu(); }
        });
        hls.on(window.Hls.Events.LEVEL_SWITCHED, function () {
          if (state.player.hls !== hls) { return; }
          if (!settingsMenu.hidden) { renderSettingsMenu(); }
        });
        hls.on(window.Hls.Events.SUBTITLE_TRACKS_UPDATED, function () {
          if (state.player.hls !== hls) { return; }
          syncSubtitleTracks();
          if (!settingsMenu.hidden) { renderSettingsMenu(); }
        });
        hls.on(window.Hls.Events.AUDIO_TRACKS_UPDATED, function () {
          if (state.player.hls !== hls) { return; }
          syncAudioTracks();
          if (!settingsMenu.hidden) { renderSettingsMenu(); }
        });
        hls.on(window.Hls.Events.AUDIO_TRACK_SWITCHED, function () {
          if (state.player.hls !== hls) { return; }
          state.player.audioIndex = hls.audioTrack;
          if (!settingsMenu.hidden) { renderSettingsMenu(); }
        });
        hls.on(window.Hls.Events.ERROR, function (_event, data) {
          if (!data || !data.fatal || state.player.hls !== hls) { return; }
          if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR && !state.player.recovered) {
            state.player.recovered = true;
            hls.recoverMediaError();
            return;
          }
          handleSourceFailure("This source stopped responding.");
        });
        hls.loadSource(url);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.load();
      } else {
        handleSourceFailure("This browser cannot play HLS.");
        return;
      }
    } else {
      video.src = url;
      video.load();
    }
    attemptAutoplay();
  }

  // Pressing play has to actually play. The source lookup sits between the click
  // and play(), which can spend the browser's user activation, so a refused
  // play() falls back to muted playback instead of parking on a poster.
  function attemptAutoplay() {
    video.playbackRate = prefs.speed;
    var started = video.play();
    if (!started || typeof started.catch !== "function") { return; }
    started.catch(function () {
      if (!video.paused) { return; }
      video.muted = true;
      state.player.automuted = true;
      var retried = video.play();
      if (retried && typeof retried.then === "function") {
        retried.then(function () {
          updateVolumeUI();
          toast("Started muted - click once to unmute.");
        }).catch(function () {
          showBigPlay();
          hideLoading();
        });
      }
    });
  }

  function resumeAudio() {
    if (!state.player.automuted) { return; }
    state.player.automuted = false;
    video.muted = false;
    setVolume(prefs.volume / 100);
    updateVolumeUI();
  }

  // Best source that has not been tried yet. The list order is whatever the
  // providers answered in, so walking it one by one would hand a failure to a
  // 360p mirror while a 4K one sat two rows down.
  function nextUntriedSource() {
    var sources = state.player.sources;
    var tried = state.player.tried;
    var best = -1;
    var bestScore = -1;
    sources.forEach(function (source, index) {
      if (!source || !source.url || tried.indexOf(index) >= 0) { return; }
      var height = Math.min(Number(source.height) || 0, 1080);
      var hls = source.type === "hls" || /\.m3u8(\?|$)/i.test(source.url) ? 1 : 0;
      var score = height * 10 + hls;
      if (score > bestScore) {
        bestScore = score;
        best = index;
      }
    });
    return best;
  }

  function handleSourceFailure(message) {
    if (!state.player.open) { return; }
    if (state.player.auto) {
      var next = nextUntriedSource();
      if (next >= 0) {
        toast(message + " Trying " + (state.player.sources[next].provider || "the next source") + "…");
        loadSource(state.player.sources[next], state.player.sources, next, true);
        return;
      }
    }
    showError("Playback failed", message + " Pick another source or try again.");
  }

  // Providers that only ship a watch page get an iframe. Their player owns
  // playback from there: our transport, captions and quality controls have
  // nothing to control, so the frame sits above them and they stay inert.
  function showEmbed(url) {
    state.player.embed = true;
    embedEl.src = url;
    embedEl.hidden = false;
    hideLoading();
    playerEl.classList.add("embed");
  }

  function hideEmbed() {
    state.player.embed = false;
    playerEl.classList.remove("embed");
    if (embedEl.hidden) return;
    embedEl.hidden = true;
    embedEl.removeAttribute("src");
  }

  function destroyHls() {
    if (state.player.hls) {
      state.player.hls.destroy();
      state.player.hls = null;
    }
  }

  function hlsQualityOptions(hls) {
    var seen = {};
    (hls.levels || []).forEach(function (level) {
      var height = Math.round(Number(level.height) || 0);
      if (height > 0) { seen[height] = true; }
    });
    return Object.keys(seen).map(Number).sort(function (left, right) { return right - left; });
  }

  // The panel in physical pixels. devicePixelRatio is the whole point: a 700px
  // tall picture on a 2x screen wants 1400 pixels of data, not 700.
  function panelPixelHeight() {
    var rect = video.getBoundingClientRect();
    var css = rect.height > 0 ? rect.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    return Math.round(css * Math.min(dpr, 2));
  }

  // Auto picks the smallest rung that covers the panel, then lets hls.js pick
  // below it. One rung of headroom covers scaling; a second rung is pixels
  // nobody can see, paid for in bandwidth.
  function autoQualityHeight() {
    var hls = state.player.hls;
    if (!hls || !hls.levels || hls.levels.length === 0) { return 0; }
    var wanted = panelPixelHeight();
    var rungs = hls.levels
      .map(function (level) { return Math.round(Number(level.height) || 0); })
      .filter(function (height) { return height > 0; })
      .sort(function (left, right) { return left - right; });
    if (rungs.length === 0) { return 0; }
    for (var i = 0; i < rungs.length; i += 1) {
      if (rungs[i] >= wanted) { return rungs[i]; }
    }
    return rungs[rungs.length - 1];
  }

  function applyQualityTarget() {
    var hls = state.player.hls;
    if (!hls) { return; }
    if (state.player.qualityTarget > 0) {
      hls.autoLevelCapping = -1;
      var index = (hls.levels || []).findIndex(function (level) {
        return Math.round(Number(level.height) || 0) === state.player.qualityTarget;
      });
      if (index >= 0) { hls.currentLevel = index; }
      return;
    }
    // ABR stays in charge of falling back, it just may not climb past the panel.
    var ceiling = autoQualityHeight();
    hls.autoLevelCapping = ceiling > 0
      ? (hls.levels || []).findIndex(function (level) {
          return Math.round(Number(level.height) || 0) === ceiling;
        })
      : -1;
    hls.currentLevel = -1;
  }

  function selectQuality(height) {
    state.player.qualityTarget = Number(height) || 0;
    applyQualityTarget();
    renderSettingsMenu();
  }

  function nativeSubtitleTracks() {
    var tracks = [];
    for (var index = 0; index < video.textTracks.length; index += 1) {
      var track = video.textTracks[index];
      if (track.kind === "subtitles" || track.kind === "captions") {
        tracks.push({
          index: index,
          name: track.label || track.language || "Track " + (index + 1),
          lang: (track.language || "").toLowerCase()
        });
      }
    }
    return tracks;
  }

  function syncSubtitleTracks() {
    var hls = state.player.hls;
    var source = "native";
    var tracks = [];
    if (hls && hls.subtitleTracks && hls.subtitleTracks.length > 0) {
      source = "hls";
      tracks = hls.subtitleTracks.map(function (track, index) {
        return {
          index: index,
          name: track.name || track.lang || "Track " + (index + 1),
          lang: (track.lang || "").toLowerCase()
        };
      });
    } else {
      tracks = nativeSubtitleTracks();
    }
    state.player.subtitleSource = source;
    state.player.subtitles = tracks;
    syncCaptionsButton();
    if (state.player.subtitleIndex >= tracks.length) {
      state.player.subtitleIndex = -1;
    }
    // Embedded track in the viewer's language: turn it on without a menu trip.
    var wanted = captionLanguage().slice(0, 2);
    if (!state.player.captionsOff && state.player.subtitleIndex < 0 && wanted) {
      var match = tracks.findIndex(function (track) {
        return track.lang !== "" && track.lang.indexOf(wanted) === 0;
      });
      if (match >= 0) {
        state.player.subtitleIndex = match;
        state.player.subtitleLang = tracks[match].lang;
      }
    }
    syncCaptionsButton();
    if (source === "hls") {
      // hls.js keeps the cue data, the overlay does the drawing.
      hls.subtitleDisplay = false;
      hls.subtitleTrack = state.player.subtitleIndex < 0 ? -1 : state.player.subtitleIndex;
      maybeAutoCaptions();
      return;
    }
    for (var index = 0; index < video.textTracks.length; index += 1) {
      var track = video.textTracks[index];
      if (track.kind === "subtitles" || track.kind === "captions") {
        track.mode = index === state.player.subtitleIndex ? "hidden" : "disabled";
      }
    }
    maybeAutoCaptions();
  }

  // One press turns captions on with the last language used, another turns them off.
  function toggleCaptions() {
    if (state.player.subtitles.length === 0) {
      // Nothing embedded: reach for OpenSubtitles instead of just saying no.
      state.player.captionsOff = false;
      state.player.externalKey = "";
      searchOpenSubtitles(true);
      return;
    }
    if (state.player.subtitleIndex >= 0) {
      selectSubtitle(-1);
      return;
    }
    var wanted = state.player.subtitleLang;
    var track = state.player.subtitles.find(function (entry) {
      return wanted && entry.lang && entry.lang.indexOf(wanted) === 0;
    }) || state.player.subtitles[0];
    selectSubtitle(track.index);
  }

  function syncCaptionsButton() {
    captionsBtn.classList.toggle("active", state.player.subtitleIndex >= 0);
    captionsBtn.setAttribute("aria-pressed", state.player.subtitleIndex >= 0 ? "true" : "false");
  }

  function selectSubtitle(index) {
    index = Number(index);
    if (!Number.isInteger(index) || index < 0) {
      state.player.subtitleIndex = -1;
      state.player.subtitleLang = "";
      state.player.captionsOff = true;
    } else {
      state.player.captionsOff = false;
      var track = state.player.subtitles.find(function (entry) { return entry.index === index; });
      if (!track) { return; }
      state.player.subtitleIndex = index;
      state.player.subtitleLang = track.lang || "";
    }
    if (state.player.subtitleSource === "hls" && state.player.hls) {
      state.player.hls.subtitleDisplay = false;
      state.player.hls.subtitleTrack = state.player.subtitleIndex;
    } else {
      for (var trackIndex = 0; trackIndex < video.textTracks.length; trackIndex += 1) {
        var nativeTrack = video.textTracks[trackIndex];
        if (nativeTrack.kind === "subtitles" || nativeTrack.kind === "captions") {
          nativeTrack.mode = trackIndex === state.player.subtitleIndex ? "hidden" : "disabled";
        }
      }
    }
    syncCaptionsButton();
    renderSettingsMenu();
  }

  function syncAudioTracks() {
    var hls = state.player.hls;
    if (!hls) {
      state.player.audioTracks = [];
      state.player.audioIndex = -1;
      return;
    }
    var tracks = (hls.audioTracks || []).map(function (track, index) {
      return {
        index: index,
        name: track.name || track.lang || "Track " + (index + 1),
        lang: (track.lang || "").toLowerCase()
      };
    });
    state.player.audioTracks = tracks;
    if (state.player.audioLang && tracks.length > 1) {
      var match = tracks.findIndex(function (track) {
        return track.lang !== "" && track.lang.indexOf(state.player.audioLang) === 0;
      });
      if (match >= 0) { hls.audioTrack = match; }
    }
    if (hls.audioTrack >= 0 && hls.audioTrack < tracks.length) {
      state.player.audioIndex = hls.audioTrack;
    } else if (tracks.length === 0) {
      state.player.audioIndex = -1;
    }
  }

  function selectAudio(index) {
    var track = state.player.audioTracks.find(function (entry) { return entry.index === index; });
    if (!track || !state.player.hls) { return; }
    state.player.audioIndex = index;
    state.player.audioLang = track.lang || "";
    state.player.hls.audioTrack = index;
    renderSettingsMenu();
  }

  function qualityLabel(height) {
    if (height >= 2160) { return "4K"; }
    if (height >= 1080) { return "Full HD"; }
    if (height >= 720) { return "HD"; }
    return "SD";
  }

  function sheetTile(label, value, attrs, active) {
    return '<button type="button" ' + attrs + ' class="sheet-tile' + (active ? " active" : "") + '">' +
      '<span class="tile-label">' + esc(label) + '</span>' +
      '<span class="tile-value">' + esc(value) + "</span></button>";
  }

  function sheetRow(label, value, attrs, iconName) {
    return '<button type="button" ' + attrs + ' class="sheet-row">' +
      '<span class="row-value">' + esc(label) + (value ? " · " + esc(value) : "") + "</span>" +
      icon(iconName, { size: 18 }) + "</button>";
  }

  function sheetHead(title) {
    return '<div class="sheet-head">' +
      '<button class="sheet-back" type="button" data-sheet-back aria-label="Back">' + icon("caretLeft", { size: 15 }) + "</button>" +
      '<span class="sheet-title">' + esc(title) + "</span></div>";
  }

  function sheetOption(label, note, attrs, active) {
    return '<button type="button" ' + attrs + ' class="sheet-option' + (active ? " active" : "") + '">' +
      esc(label) + (note ? '<span class="opt-label">' + esc(note) + "</span>" : "") + "</button>";
  }

  var CAPTION_LANGUAGES = [
    ["auto", "match my language"],
    ["en", "english"], ["es", "spanish"], ["fr", "french"], ["de", "german"],
    ["it", "italian"], ["pt", "portuguese"], ["pt-br", "portuguese (br)"],
    ["ru", "russian"], ["ja", "japanese"], ["ko", "korean"], ["zh", "chinese"],
    ["ar", "arabic"], ["hi", "hindi"], ["nl", "dutch"], ["pl", "polish"],
    ["tr", "turkish"], ["sv", "swedish"], ["no", "norwegian"], ["da", "danish"],
    ["fi", "finnish"], ["cs", "czech"], ["el", "greek"], ["he", "hebrew"],
    ["hu", "hungarian"], ["id", "indonesian"], ["ro", "romanian"], ["uk", "ukrainian"]
  ];

  var SLEEP_CHOICES = [0, 15, 30, 45, 60, 90];

  // The browser's own preference when the setting is left on auto, so a French
  // visitor gets French captions without touching a menu.
  function captionLanguage() {
    if (prefs.captionLang && prefs.captionLang !== "auto") { return prefs.captionLang; }
    var tag = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
    return String(tag).toLowerCase();
  }

  function imdbIdOfPlayer() {
    var context = state.player.context;
    if (!context || !context.detail) { return ""; }
    return context.detail.imdbId || "";
  }

  function removeExternalTracks() {
    var nodes = video.querySelectorAll("track[data-external]");
    for (var i = 0; i < nodes.length; i += 1) { nodes[i].remove(); }
    if (state.player.externalUrl) {
      URL.revokeObjectURL(state.player.externalUrl);
      state.player.externalUrl = "";
    }
    state.player.externalKey = "";
  }

  // OpenSubtitles answers with WebVTT already; the track is just a blob the
  // element owns, so nothing here depends on the source supporting captions.
  function attachSubtitleTrack(vtt, label, lang) {
    var blob = new Blob([vtt], { type: "text/vtt" });
    var url = URL.createObjectURL(blob);
    var element = document.createElement("track");
    element.kind = "subtitles";
    element.label = label || "OpenSubtitles";
    element.srclang = String(lang || "en").slice(0, 2).toLowerCase();
    element.src = url;
    element.dataset.external = "1";
    state.player.externalUrl = url;
    video.appendChild(element);

    var adopt = function () {
      var index = Array.prototype.indexOf.call(video.textTracks, element.track);
      state.player.subtitles = nativeSubtitleTracks();
      state.player.subtitleSource = "native";
      if (index >= 0) {
        state.player.captionsOff = false;
        selectSubtitle(index);
      }
    };
    element.addEventListener("load", adopt, { once: true });
    // Firefox fires cuechange before load on blob tracks; either order lands.
    setTimeout(adopt, 700);
  }

  function searchOpenSubtitles(announce) {
    var imdb = imdbIdOfPlayer();
    if (!imdb) {
      if (announce) { toast("This title has no IMDb id, so there is nothing to match."); }
      return;
    }
    if (state.player.externalPending) { return; }
    state.player.externalPending = true;
    var lang = captionLanguage();
    var context = state.player.context;
    var params = new URLSearchParams({ imdb: imdb, lang: lang });
    if (context && context.detail.mediaType === "tv") {
      params.set("season", String(context.season || 1));
      params.set("episode", String(context.episode || 1));
    }
    if (!settingsMenu.hidden) { renderSettingsMenu(); }

    fetch("/os/track?" + params.toString(), { signal: state.player.abort ? state.player.abort.signal : undefined })
      .then(function (response) {
        if (!response.ok) { throw new Error("OpenSubtitles has nothing for " + lang + "."); }
        var name = "";
        try { name = decodeURIComponent(response.headers.get("x-subtitle-name") || ""); } catch (_error) { name = ""; }
        return response.text().then(function (vtt) { return { vtt: vtt, name: name }; });
      })
      .then(function (result) {
        if (!state.player.open) { return; }
        attachSubtitleTrack(result.vtt, result.name || "OpenSubtitles · " + lang, lang);
        if (announce) { toast("Captions loaded from OpenSubtitles."); }
      })
      .catch(function (error) {
        if (error && error.name === "AbortError") { return; }
        if (announce) { toast(error.message || "OpenSubtitles lookup failed."); }
      })
      .then(function () {
        state.player.externalPending = false;
        if (!settingsMenu.hidden) { renderSettingsMenu(); }
      });
  }

  // Called every time the track list settles: if the source carries no caption
  // in the viewer's language, ask OpenSubtitles instead of leaving them mute.
  function maybeAutoCaptions() {
    if (!state.player.open || state.player.captionsOff) { return; }
    var context = state.player.context;
    if (!context || !context.detail || !context.detail.imdbId) { return; }
    var wanted = captionLanguage().slice(0, 2);
    var hasMatch = state.player.subtitles.some(function (track) {
      return track.lang && track.lang.indexOf(wanted) === 0;
    });
    if (hasMatch) { return; }
    var key = context.detail.imdbId + ":" + captionLanguage() + ":" + (context.season || 0) + ":" + (context.episode || 0);
    if (state.player.externalKey === key) { return; }
    state.player.externalKey = key;
    searchOpenSubtitles(false);
  }

  function setSleepTimer(minutes) {
    clearSleepTimer();
    state.player.sleepMinutes = minutes;
    if (!minutes) { return; }
    state.player.sleepAt = Date.now() + minutes * 60000;
    state.player.sleepTimer = setTimeout(function () {
      state.player.sleepAt = 0;
      state.player.sleepTimer = null;
      video.pause();
      toast("Sleep timer ended - playback paused.");
      if (!settingsMenu.hidden) { renderSettingsMenu(); }
    }, minutes * 60000);
    toast("Sleep timer set for " + minutes + " minutes.");
  }

  function clearSleepTimer() {
    if (state.player.sleepTimer) {
      clearTimeout(state.player.sleepTimer);
      state.player.sleepTimer = null;
    }
    state.player.sleepAt = 0;
  }

  function downloadCurrent() {
    var source = state.player.source;
    if (!source || !source.url) { toast("Nothing is playing to download."); return; }
    var url = source.url;
    var params = new URLSearchParams({ url: source.url });
    if (source.headers && Object.keys(source.headers).length > 0) {
      params.set("headers", JSON.stringify(source.headers));
    }
    if (source.query && Object.keys(source.query).length > 0) {
      params.set("query", JSON.stringify(source.query));
    }
    if (params.has("headers") || params.has("query")) { url = "/api/proxy?" + params.toString(); }
    var title = state.player.context && state.player.context.detail ? state.player.context.detail.title : "stream";
    var anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = String(title || "stream").replace(/[^\w.-]+/g, "-") + (source.type === "hls" ? ".m3u8" : ".mp4");
    anchor.rel = "noopener";
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    toast("Download started - your browser may open it in a tab.");
  }

  function copyInviteLink() {
    var link = location.href;
    var done = function () { toast("Invite link copied."); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done).catch(function () { toast(link); });
      return;
    }
    toast(link);
  }

  function handleSheetAction(action) {
    if (action === "toggle-captions") {
      toggleCaptions();
      renderSettingsMenu();
      return;
    }
    if (action === "download") {
      downloadCurrent();
      return;
    }
    if (action === "copy-link") {
      copyInviteLink();
      return;
    }
    if (action === "search-subtitles") {
      state.player.captionsOff = false;
      state.player.externalKey = "";
      searchOpenSubtitles(true);
    }
  }

  function captionLabel() {
    var code = captionLanguage();
    var entry = CAPTION_LANGUAGES.find(function (item) { return item[0] === code; });
    if (entry) { return entry[1]; }
    var base = code.split("-")[0];
    var fallback = CAPTION_LANGUAGES.find(function (item) { return item[0] === base; });
    return fallback ? fallback[1] : code;
  }

  function qualityValue() {
    if (state.player.qualityTarget > 0) { return state.player.qualityTarget + "p"; }
    var height = autoQualityHeight();
    return height > 0 ? "Auto · " + height + "p" : "Auto";
  }

  function sourceValue() {
    var source = state.player.source;
    if (!source) { return state.player.sources.length > 0 ? "Loading" : "None"; }
    if (state.player.auto) {
      return "Auto · " + (source.height ? source.height + "p" : source.type || "stream");
    }
    return source.provider || "Source";
  }

  function subtitleValue() {
    if (state.player.subtitleIndex < 0) { return "Off"; }
    var track = state.player.subtitles.find(function (entry) { return entry.index === state.player.subtitleIndex; });
    if (!track) { return "On"; }
    if (track.lang) { return track.lang.toUpperCase(); }
    return track.name;
  }

  function audioValue() {
    if (state.player.audioIndex < 0) { return "Default"; }
    var track = state.player.audioTracks.find(function (entry) { return entry.index === state.player.audioIndex; });
    if (!track) { return "Default"; }
    return track.lang ? track.lang.toUpperCase() : track.name;
  }

  function sleepValue() {
    if (!state.player.sleepAt) { return "Off"; }
    var left = Math.max(0, Math.round((state.player.sleepAt - Date.now()) / 60000));
    return left > 0 ? left + " min left" : "ending";
  }

  function renderSettingsMenu() {
    var view = state.player.sheet || "";
    if (view === "quality") {
      state.player.qualityOptions.length === 0 && (state.player.qualityOptions = state.player.hls ? hlsQualityOptions(state.player.hls) : []);
      var qualityHtml = sheetHead("Quality") + '<div class="sheet-list">';
