<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0f">
<title>Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23aac7ff%27/%3E%3Cpath d=%27M12 9l11 7-11 7z%27 fill=%27%2306182e%27/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;

    /* The cinema stays dark whatever the shell theme is; only the accent is
       handed down, because a light ground behind white title art is unreadable. */
    --page: var(--movie-ground, #0f0f0f);
    --ink: var(--movie-ink, #f2f2f2);
    --accent: #ffffff;

    --movy-surface: color-mix(in srgb, var(--ink) 8%, var(--page));
    --movy-surface-2: color-mix(in srgb, var(--ink) 13%, var(--page));
    --movy-line: color-mix(in srgb, var(--ink) 6%, transparent);
    --movy-line-strong: color-mix(in srgb, var(--ink) 16%, transparent);
    --movy-muted: color-mix(in srgb, var(--ink) 68%, transparent);
    --movy-dim: color-mix(in srgb, var(--ink) 45%, transparent);

    --theme-bg: var(--page);
    --bg-base: var(--page);
    --bg-1-base: color-mix(in srgb, var(--ink) 3%, var(--page));
    --bg-2-base: color-mix(in srgb, var(--ink) 5%, var(--page));
    --bg-3-base: color-mix(in srgb, var(--ink) 8%, var(--page));
    --bg-4-base: color-mix(in srgb, var(--ink) 11%, var(--page));
    --accent-2: color-mix(in srgb, var(--accent) 70%, var(--ink));
    --accent-glow: color-mix(in srgb, var(--accent) 40%, transparent);
    --bright-text: var(--ink);
    --text: var(--ink);
    --text-muted: color-mix(in srgb, var(--ink) 62%, transparent);
    --border-3: color-mix(in srgb, var(--ink) 12%, transparent);
    --panel-border: var(--border-3);
    --field: color-mix(in srgb, var(--ink) 7%, transparent);
    --on-accent: var(--page);
    /* The billboard fades into this instead of the page, so the art keeps a dark
       stage when the shell is on paper. */
    --hero-fade: var(--page);
    --danger: #ff7b7b;

    /* Shell corner scale: square-ish everywhere, one step per size. */
    --radius-xs: 3px;
    --radius-sm: 4px;
    --radius-md: 5px;
    --radius-lg: 6px;
    --radius-xl: 8px;
    --radius-pill: 5px;

    --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-body: var(--font-ui);
    --font-display: "Space Grotesk", var(--font-ui);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    --dur-1: 140ms;
    --dur-2: 200ms;

    /* Cinematic family: same ground, mixed toward black for depth. */
    --cine-bg: var(--page);
    --cine-deep: color-mix(in srgb, #000 40%, var(--page));
    --cine-surface: var(--bg-2-base);
    --cine-surface-2: var(--bg-3-base);
    --cine-line: color-mix(in srgb, var(--ink) 12%, transparent);
    --cine-line-soft: color-mix(in srgb, var(--ink) 8%, transparent);
    --cine-line-strong: color-mix(in srgb, var(--ink) 18%, transparent);
    --cine-text: var(--ink);
    --cine-muted: color-mix(in srgb, var(--ink) 62%, transparent);
    --cine-dim: color-mix(in srgb, var(--ink) 42%, transparent);
    --cine-glass: color-mix(in srgb, var(--page) 72%, transparent);

    --bg: var(--cine-bg);
    --bg-2: var(--cine-deep);
    --panel: var(--cine-surface);
    --panel-2: var(--cine-surface-2);
    --line: var(--cine-line);
    --line-soft: var(--cine-line-soft);
    --line-strong: var(--cine-line-strong);
    --muted: var(--cine-muted);
    --hot: var(--accent);
    --radius: var(--radius-md);
    --max: 1400px;
    --header: 64px;
    --shadow: 0 24px 60px rgb(0 0 0 / 55%);
  }

  /* Light shell: the page below the billboard is paper, but the billboard itself
     keeps a dark stage so title art and white type still read. */
  html[data-mode="light"] {
    --hero-fade: color-mix(in srgb, #000 74%, var(--page));
  }
  html[data-mode="light"] .player,
  html[data-mode="light"] .player-shell {
    --text: #f4f6f9;
    --bright-text: #fff;
    --muted: #c4cad6;
    --line: #ffffff2e;
    --line-strong: #ffffff52;
  }
  html[data-mode="light"] .hero {
    --text: #f4f6f9;
    --bright-text: #fff;
    --muted: #c4cad6;
    --line: #ffffff2e;
    --line-strong: #ffffff52;
    --panel: #ffffff1a;
    --panel-2: #ffffff26;
    --panel-border: #ffffff2e;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; font-family: var(--font-body); }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button, input, select, textarea, .btn, .nav, .logo-text small, .chip, .tab,
  .filter-toggle, .episode-play, .source-row, .search-kbd, .eyebrow, .pill {
    font-family: var(--font-ui);
  }
  h1, h2, h3, h4, .logo-text, .feature-title, .detail-title, .row-head h2 {
    font-family: var(--font-display);
    letter-spacing: -0.025em;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 76% 2%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 38%),
      radial-gradient(900px 420px at 12% -8%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%);
  }
  body.player-open { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { display: block; max-width: 100%; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent); color: var(--on-accent); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ---------- header ---------- */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 92%, transparent) 0%, color-mix(in srgb, var(--bg) 55%, transparent) 62%, transparent 100%);
    transition: background var(--dur-2) var(--ease-standard);
  }
  .site-header.scrolled {
    background: color-mix(in srgb, var(--bg-base) 82%, transparent);
    backdrop-filter: blur(18px) saturate(145%);
    -webkit-backdrop-filter: blur(18px) saturate(145%);
  }
  .header-inner {
    max-width: var(--max);
    height: 76px;
    margin: 0 auto;
    padding: 0 32px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 20px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .logo-text {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.035em;
  }
  .logo-text small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 2px;
    min-width: 0;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    background: var(--cine-glass);
    overflow-x: auto;
    scrollbar-width: none;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav a {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: var(--radius-pill);
    color: var(--muted);
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: color var(--dur-1) var(--ease-out), background var(--dur-1) var(--ease-out);
  }
  .nav a svg { opacity: 0.72; }
  .nav a:hover { color: var(--text); background: var(--hover, rgba(253, 251, 255, 0.06)); }
  .nav a.active {
    position: relative;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--bright-text);
  }
  .nav a.active svg { opacity: 1; color: var(--accent); }
  .header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    flex: 0 0 auto;
  }
  .search {
    position: relative;
    width: min(330px, 30vw);
    min-width: 180px;
  }
  .search svg {
    position: absolute;
    left: 11px;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    fill: var(--muted);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 40px;
    padding: 0 62px 0 37px;
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--field);
    color: var(--bright-text);
    font-family: var(--font-ui);
    font-size: 14px;
    outline: none;
    transition: border-color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out);
  }
  .search input::-webkit-search-cancel-button,
  .search input::-webkit-search-decoration {
    -webkit-appearance: none;
    appearance: none;
    display: none;
  }
  .search input::placeholder { color: var(--cine-dim); }
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .search-clear {
    position: absolute;
    right: 7px;
    top: 50%;
    width: 24px;
    height: 24px;
    transform: translateY(-50%);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    display: none;
    place-items: center;
    font-size: 18px;
    line-height: 1;
  }
  .search-clear:hover { color: var(--text); background: rgba(255, 255, 255, 0.07); }
  .search.has-value .search-clear { display: grid; }
  .search-kbd {
    position: absolute;
    right: 37px;
    top: 50%;
    transform: translateY(-50%);
    min-width: 19px;
    height: 19px;
    padding: 0 4px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font: 600 10px/17px var(--font-ui);
    font-variant-numeric: tabular-nums;
    text-align: center;
    pointer-events: none;
  }
  .search.has-value .search-kbd { display: none; }
  /* ---------- icon + label alignment ----------
     `align-items: center` centres the line box, but Archivo's glyphs sit a
     fraction of an em above that centre. Every icon that rides beside a label
     drops by the same fraction so it lands on the text's optical midline. */
  .logo > svg,
  .logo > .logo-mark,
  .nav a > svg,
  .btn > svg,
  .pill > svg,
  .hero-rank > svg,
  .hero-tag > svg,
  .meta-item > svg,
  .see-all > svg,
  .card-new > svg,
  .rating > svg,
  .feature-rank > svg,
  .feature-play > svg,
  .filter-toggle > svg,
  .back-btn > svg,
  .source-provider > svg,
  .player-next > svg,
  .player-brand > svg,
  .sheet-row > svg,
  .sheet-option > svg,
  .source-row > svg,
  .episode-play > svg,
  .eyebrow > svg {
    transform: translateY(0.06em);
  }

  /* ---------- shared ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 42px;
    padding: 0 17px;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    background: var(--panel);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 650;
    transition: border-color var(--dur-1) var(--ease-out), background var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
  }
  .btn:hover { border-color: var(--line-strong); background: var(--panel-2); }
  .btn:active { transform: scale(0.97); }
  .btn.primary {
    border-color: transparent;
    background: var(--accent);
    color: var(--on-accent);
  }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.ghost { background: color-mix(in srgb, var(--bright-text) 6%, transparent); border-color: var(--line-strong); }
  .btn.ghost:hover { background: color-mix(in srgb, var(--bright-text) 10%, transparent); }
  .btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    height: 22px;
    padding: 0 9px;
    border-radius: var(--radius-xl);
    background: rgba(170, 199, 255, 0.14);
    border: 1px solid rgba(170, 199, 255, 0.32);
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .muted { color: var(--muted); }
  .icon { display: inline-block; vertical-align: middle; flex: 0 0 auto; }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    width: 100%;
    min-height: clamp(560px, 82vh, 830px);
    background-color: var(--bg-2);
    background-size: cover;
    background-position: center 24%;
    background-repeat: no-repeat;
    isolation: isolate;
  }
  .hero-shade {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 78%, transparent) 36%, color-mix(in srgb, var(--bg) 12%, transparent) 70%, color-mix(in srgb, var(--bg) 30%, transparent) 100%),
      linear-gradient(0deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 78%, transparent) 12%, transparent 48%),
      linear-gradient(180deg, color-mix(in srgb, var(--bg) 72%, transparent) 0%, transparent 24%);
  }
  .hero-content {
    position: relative;
    z-index: 1;
    max-width: var(--max);
    margin: 0 auto;
    width: 100%;
    padding: 130px 28px 86px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: inherit;
  }
  .hero-badges {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px;
    margin-bottom: 15px;
  }
  .hero-rank {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 24px;
    padding: 0 9px;
    border-radius: var(--radius-sm);
    background: var(--hot);
    color: var(--on-accent);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
  }
  .hero-rank b {
    font-size: 14px;
    letter-spacing: -0.02em;
  }
  .hero-tag {
    display: inline-flex;
    align-items: center;
    height: 24px;
    padding: 0 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-sm);
    background: rgba(10, 12, 16, 0.38);
    color: var(--bright-text);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    backdrop-filter: blur(8px);
  }
  .hero-content h1 {
    margin: 0 0 14px;
    max-width: 16ch;
    font-size: clamp(40px, 5.4vw, 80px);
    line-height: 0.97;
    letter-spacing: -0.045em;
    font-weight: 900;
    text-wrap: balance;
    text-shadow: 0 6px 44px rgba(0, 0, 0, 0.55);
  }
  .hero-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 0;
    color: var(--text);
    font-size: 14px;
    font-weight: 550;
  }
  .hero-meta .meta-item,
  .detail-meta .meta-item {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
  }
  .hero-meta .meta-item:not(:last-child)::after,
  .detail-meta .meta-item:not(:last-child)::after {
    content: "·";
    margin: 0 10px;
    color: #77818f;
    font-weight: 500;
  }
  .hero-meta .rating {
    color: var(--accent);
    font-weight: 750;
  }
  .hero-meta .hero-genres { color: #b7c0cc; }
  .hero-overview {
    margin: 15px 0 0;
    max-width: 62ch;
    color: var(--text);
    font-size: 15.5px;
    line-height: 1.65;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .hero-actions .btn { min-height: 46px; padding: 0 20px; border-radius: var(--radius-lg); }
  .hero-dots {
    position: absolute;
    right: 28px;
    bottom: 30px;
    display: flex;
    gap: 7px;
    z-index: 2;
  }
  .hero-dot {
    width: 22px;
    height: 3px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-xs);
    background: rgba(255, 255, 255, 0.26);
    transition: background 0.2s, width 0.2s;
  }
  .hero-dot.active { width: 36px; background: var(--accent); }
  .hero-arrow {
    position: absolute;
    top: 50%;
    z-index: 2;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 50%;
    background: rgba(6, 8, 11, 0.5);
    color: #fff;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: translateY(-50%);
    transition: opacity 0.2s, background 0.2s;
    backdrop-filter: blur(8px);
  }
  .hero:hover .hero-arrow,
  .hero-arrow:focus-visible { opacity: 1; }
  .hero-arrow:hover { background: rgba(6, 8, 11, 0.85); }
  .hero-arrow.prev { left: 20px; }
  .hero-arrow.next { right: 20px; }

  /* ---------- rows ---------- */
  .row-section {
    max-width: var(--max);
    margin: 38px auto 0;
    padding: 0 28px;
  }
  .row-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .row-head h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 750;
    letter-spacing: -0.025em;
  }
  .see-all {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 29px;
    padding: 0 9px;
    border-radius: var(--radius-xl);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    transition: color 0.15s, background 0.15s;
  }
  .see-all:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
  .see-all:hover { color: var(--accent); }
  .row-wrap { position: relative; }
  .row-scroller {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 3px 0 14px;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .row-scroller::-webkit-scrollbar { display: none; }
  .row-arrow {
    position: absolute;
    top: calc(50% - 24px);
    z-index: 3;
    width: 36px;
    height: 62px;
    border: 0;
    border-radius: var(--radius-lg);
    background: rgba(10, 12, 16, 0.82);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 22px;
    opacity: 0;
    transition: opacity 0.15s;
    backdrop-filter: blur(8px);
  }
  .row-wrap:hover .row-arrow { opacity: 1; }
  .row-arrow.prev { left: -8px; }
  .row-arrow.next { right: -8px; }

  /* ---------- cards ---------- */
  .card {
    flex: 0 0 168px;
    width: 168px;
    min-width: 0;
    scroll-snap-align: start;
    cursor: pointer;
  }
  .card-poster {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .card-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }
  .card:hover .card-poster img { transform: scale(1.045); }
  .card:hover .card-poster {
    transform: translateY(-4px);

    place-items: center;
    font-size: 15px;
    padding-left: 2px;
  }
  .episode-play:hover { background: var(--accent); color: var(--on-accent); }

  /* ---------- sources ---------- */
  .source-panel {
    margin-top: 22px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--panel);
    overflow: hidden;
  }
  .source-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .source-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .source-head .muted { font-size: 13px; }
  .source-head .spacer { flex: 1; }
  .source-list { padding: 4px 16px 12px; }
  .source-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
    font-family: var(--font-ui);
    font-size: 13px;
  }
  .source-row:last-child { border-bottom: 0; }
  .source-provider {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-width: 90px;
    color: var(--muted);
    font-family: var(--font-ui);
    font-size: 12.5px;
  }
  .source-label { min-width: 92px; font-weight: 600; }
  .source-type { min-width: 50px; color: var(--muted); font-size: 11.5px; letter-spacing: 0.01em; }
  .source-row .spacer { flex: 1; }
  .source-empty { padding: 14px 0; color: var(--muted); font-size: 14px; }
  .source-stats {
    padding: 0 0 10px;
    color: var(--muted);
    font-size: 12.5px;
    letter-spacing: 0.01em;
  }

  /* ---------- states / skeleton ---------- */
  .state-box {
    max-width: 540px;
    margin: 70px auto;
    padding: 30px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--panel);
    text-align: center;
  }
  .state-box h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.02em; }
  .state-box p { margin: 0 auto 18px; max-width: 44ch; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .state-box .btn { margin: 0 4px; }
  .skeleton {
    background: linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 50%, var(--panel) 75%);
    background-size: 220% 100%;
    animation: shimmer 1.5s infinite linear;
    border-radius: var(--radius-md);
  }
  @keyframes shimmer { to { background-position: -220% 0; } }
  .skeleton-hero { width: 100%; min-height: clamp(560px, 82vh, 830px); border-radius: 0; }
  .skeleton-row { max-width: var(--max); margin: 38px auto 0; padding: 0 28px; }
  .skeleton-row .bar { width: 180px; height: 20px; margin-bottom: 14px; }
  .skeleton-cards { display: flex; gap: 14px; overflow: hidden; }
  .skeleton-card { flex: 0 0 168px; aspect-ratio: 2 / 3; border-radius: var(--radius-lg); }

  /* ---------- footer ---------- */
  .site-footer {
    margin-top: 70px;
    border-top: 1px solid var(--line-soft);
    background: linear-gradient(180deg, color-mix(in srgb, var(--bright-text) 2%, transparent), transparent 60%);
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 13px;
  }
  .footer-inner {
    max-width: var(--max);
    margin: 0 auto;
    padding: 38px 28px 26px;
    display: grid;
    grid-template-columns: minmax(220px, 1.6fr) repeat(3, minmax(130px, 1fr));
    gap: 28px;
  }
  .footer-brand .logo { margin-bottom: 12px; }
  .footer-brand p { margin: 0; max-width: 36ch; line-height: 1.7; color: var(--muted); }
  .footer-col h4 {
    margin: 0 0 10px;
    color: var(--bright-text);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .footer-col a {
    display: block;
    padding: 4px 0;
    color: var(--muted);
    transition: color var(--dur-1) var(--ease-out);
  }
  .footer-col a:hover { color: var(--accent); }
  .footer-bottom {
    max-width: var(--max);
    margin: 0 auto;
    padding: 16px 28px 30px;
    border-top: 1px solid var(--line-soft);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px 20px;
    color: var(--cine-dim);
    font-family: var(--font-ui);
    font-size: 12.5px;
  }
  .site-footer a:hover { color: var(--text); }

  /* ---------- player ---------- */
  .player {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    background: #000;
    color: #fff;
  }
  .player[data-open="true"] { display: block; }
  .player-shell { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .player video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  /* Embed providers bring their own player, so ours steps aside: the frame
     covers the stage and the custom bar hides behind a low z-index of its own. */
  /* Our transport has nothing to drive while an embed plays, and the provider
     ships its own bar at the same edge - so ours steps out of the way. */
  .player.embed .player-controls,
  .player.embed .player-center,
  .player.embed .captions,
  .player.embed .player-skip,
  .player.embed .player-heading,
  .player.embed .player-brand,
  .player.embed .player-next { display: none; }
  /* The provider puts its own logo top-left, so ours is the only thing that
     moves - a close button on the right never fights their branding. */
  .player.embed .player-top { justify-content: flex-end; }
  .player-embed {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
    z-index: 2;
  }
  .player video::cue {
    background: rgba(0, 0, 0, 0.74);
    color: #fff;
    font-family: inherit;
    font-size: 18px;
    line-height: 1.4;
  }
  /* Captions are drawn by the app, not the browser, so size and backing are
     styleable and the cue text survives the control bar fading out. */
  .captions {
    position: absolute;
    left: 50%;
    bottom: 132px;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: min(86%, 1000px);
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    transition: bottom 0.18s;
  }
  .player.idle .captions { bottom: 44px; }
  .captions span {
    display: inline-block;
    max-width: 100%;
    padding: 3px 11px;
    border-radius: var(--radius-sm);
    background: rgb(0 0 0 / 68%);
    color: #fff;
    font-size: var(--caption-size, 20px);
    font-weight: 600;
    line-height: 1.32;
    white-space: pre-line;
    text-shadow: 0 2px 8px rgb(0 0 0 / 55%);
  }
  .captions[data-bg="solid"] span { background: rgb(0 0 0 / 94%); }
  .captions[data-bg="none"] span {
    padding: 0;
    background: transparent;
    text-shadow: 0 2px 5px #000, 0 0 3px #000, 0 0 12px #000;
  }
  .player-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.72), transparent 22%),
      linear-gradient(0deg, rgba(0, 0, 0, 0.86), transparent 30%);
  }
  .player-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 24px;
    transition: opacity 0.2s;
  }
  .player-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #fff;
    text-shadow: 0 1px 8px rgb(0 0 0 / 55%);
  }
  .player-brand .logo-mark { width: 21px; height: 21px; }
  .player-brand span { font-size: 13.5px; font-weight: 650; letter-spacing: 0.01em; }
  .player-close {
    width: 36px;
    height: 36px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.35);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 17px;
    backdrop-filter: blur(8px);
  }
  .player-close:hover { background: rgba(255, 255, 255, 0.14); }
  .player-heading { min-width: 0; flex: 1; }
  .player-title {
    font-size: 16px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .player-next {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 34px;
    padding: 0 12px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: var(--radius-md);
    background: rgba(0, 0, 0, 0.3);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    backdrop-filter: blur(8px);
  }
  .player-next:hover { background: rgba(255, 255, 255, 0.14); }
  .player-center {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .player-center > * { pointer-events: auto; }
  .player-big-play {
    width: 78px;
    height: 78px;
    border: 1px solid rgb(255 255 255 / 16%);
    border-radius: var(--radius-xl);
    background: rgb(10 12 16 / 42%);
    color: #fff;
    display: grid;
    place-items: center;
    padding-left: 3px;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 46px rgb(0 0 0 / 55%);
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
  }
  .player-big-play:hover { transform: scale(1.04); background: color-mix(in srgb, var(--accent) 34%, rgb(0 0 0 / 40%)); border-color: var(--accent); }
  .player-loading {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-xl);
    background: rgba(0, 0, 0, 0.55);
    color: var(--text);
    font-size: 14px;
    backdrop-filter: blur(10px);
  }
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.22);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .player-error {
    max-width: 440px;
    padding: 24px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-xl);
    background: rgba(12, 14, 19, 0.94);
    text-align: center;
    box-shadow: var(--shadow);
  }
  .player-error strong { display: block; margin-bottom: 8px; font-size: 18px; }
  .player-error p { margin: 0 0 16px; color: #b9c1cc; font-size: 14px; line-height: 1.6; }
  .player-error-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .player-next-card {
    max-width: 420px;
    padding: 22px 26px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-xl);
    background: rgba(12, 14, 19, 0.94);
    text-align: center;
    box-shadow: var(--shadow);
  }
  .player-next-card .eyebrow { justify-content: center; }
  .player-next-card strong { display: block; margin: 9px 0 16px; font-size: 17px; }
  .next-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .next-timer { margin-top: 11px; color: #b9c1cc; font-size: 13px; font-variant-numeric: tabular-nums; }
  .player-skip {
    position: absolute;
    right: 24px;
    bottom: 108px;
    z-index: 6;
    height: 38px;
    padding: 0 16px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: var(--radius-xl);
    background: rgba(12, 14, 19, 0.76);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.01em;
    backdrop-filter: blur(10px);
    transition: background 0.15s, opacity 0.2s;
  }
  .player-skip:hover { background: rgba(255, 255, 255, 0.18); }
  .player.idle .player-skip { opacity: 0; pointer-events: none; }
  .player-controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    padding: 56px 22px 18px;
    background: linear-gradient(0deg, rgb(0 0 0 / 92%) 0%, rgb(0 0 0 / 62%) 48%, rgb(0 0 0 / 0%) 100%);
    transition: opacity 0.18s, transform 0.18s;
  }
  .player.idle .player-top, .player.idle .player-controls { opacity: 0; pointer-events: none; }
  .seek {
    position: relative;
    height: 16px;
    margin-bottom: 4px;
    cursor: pointer;
    touch-action: none;
  }
  .seek::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 5px;
    transform: translateY(-50%);
    border-radius: 3px;
    background: rgb(255 255 255 / 16%);
    transition: background 0.12s;
  }
  .seek:hover::before { background: rgb(255 255 255 / 28%); }

  .seek-buffer, .seek-played {
    position: absolute;
    left: 0;
    top: 50%;
    height: 5px;
    transform: translateY(-50%);
    border-radius: 3px;
    pointer-events: none;
  }
  .seek-buffer { background: rgb(255 255 255 / 34%); }
  .seek-played { background: var(--accent); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 55%, transparent); }
  .seek-thumb {
    position: absolute;
    top: 50%;
    width: 14px;
    height: 14px;
    margin-left: -7px;
    border-radius: 5px;
    background: var(--accent);
    transform: translateY(-50%) scale(0.85);
    transition: transform 0.12s;
    pointer-events: none;
  }
  .seek:hover .seek-thumb { transform: translateY(-50%) scale(1.1); }
  .seek-tooltip {
    position: absolute;
    bottom: 18px;
    transform: translateX(-50%);
    padding: 3px 7px;
    border-radius: var(--radius-sm);
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    white-space: nowrap;
  }
  .controls-row { display: flex; align-items: center; gap: 2px; }
  .controls-row .spacer { flex: 1 1 auto; }
  .control {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: #f4f6fa;
    display: grid;
    place-items: center;
    transition: color 0.12s, transform 0.12s;
  }
  .control:hover { color: var(--accent); }
  .control:active { transform: scale(0.94); }
  .control svg { width: 24px; height: 24px; }
  .control.play { width: 48px; }
  .control.play svg { width: 30px; height: 30px; }
  .control.skip { width: 44px; }
  .control.skip svg { width: 26px; height: 26px; }
  .control.active { color: var(--accent); }
  .volume { display: flex; align-items: center; }
  .volume input {
    width: 0;
    opacity: 0;
    accent-color: var(--accent);
    transition: width 0.18s, opacity 0.18s;
    cursor: pointer;
  }
  .volume:hover input, .volume:focus-within input { width: 70px; opacity: 1; }
  .time {
    margin-left: 12px;
    color: #f1f4f9;
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .time-sep { margin: 0 6px; color: #8d97a5; }
  .time #time-total { color: #b7c0cd; }
  .settings-menu {
    position: absolute;
    right: 18px;
    bottom: 86px;
    z-index: 8;
    width: min(322px, calc(100vw - 28px));
    max-height: min(620px, calc(100vh - 104px));
    overflow-y: auto;
    padding: 14px;
    border: 1px solid rgb(255 255 255 / 9%);
    border-radius: var(--radius-xl);
    background: rgb(17 19 24 / 98%);
    box-shadow: 0 26px 60px rgb(0 0 0 / 62%);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    scrollbar-width: thin;
    scrollbar-color: rgb(255 255 255 / 18%) transparent;
  }
  .settings-menu::-webkit-scrollbar { width: 8px; }
  .settings-menu::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background: rgb(255 255 255 / 18%);
  }
  .settings-menu[hidden] { display: none; }
  .sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheet-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    height: 50px;
    border: 0;
    border-radius: var(--radius-md);
    background: rgb(255 255 255 / 5%);
    color: #eef1f6;
    font-size: 13.5px;
    transition: background 0.12s, color 0.12s;
  }
  .sheet-tile:hover { background: rgb(255 255 255 / 9%); }
  .sheet-tile .tile-value { color: #8c96a4; font-size: 12.5px; }
  .sheet-tile.active { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .sheet-tile.active .tile-value { color: var(--accent); }
  .sheet-rows { display: flex; flex-direction: column; margin-top: 8px; }
  .sheet-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 7px 4px;
    border: 0;
    background: transparent;
    color: #e6eaf1;
    font-size: 13.5px;
    text-align: left;
    transition: color 0.12s;
  }
  .sheet-row:hover { color: var(--accent); }
  .sheet-row .row-value { flex: 1; }
  .sheet-row svg { color: #aab3c0; flex: none; transition: color 0.12s; }
  .sheet-row:hover svg { color: var(--accent); }
  .sheet-rule { height: 1px; margin: 6px 0 4px; background: rgb(255 255 255 / 10%); }
  .sheet-switch {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 7px 4px;
    border: 0;
    background: transparent;
    color: #e6eaf1;
    font-size: 13.5px;
  }
  .sheet-switch .switch {
    position: relative;
    margin-left: auto;
    width: 42px;
    height: 24px;
    border-radius: 999px;
    background: rgb(255 255 255 / 14%);
    transition: background 0.15s;
  }
  .sheet-switch .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #dfe4ec;
    transition: transform 0.15s, background 0.15s;
  }
  .sheet-switch[aria-checked="true"] .switch { background: var(--accent); }
  .sheet-switch[aria-checked="true"] .switch::after { transform: translateX(18px); background: #101318; }
  .sheet-head { display: flex; align-items: center; gap: 6px; margin: -2px 0 8px; }
  .sheet-back {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    margin-left: -6px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: #cfd6e0;
  }
  .sheet-back:hover { color: var(--accent); background: rgb(255 255 255 / 7%); }
  .sheet-title { color: #eef1f6; font-size: 13.5px; font-weight: 650; }
  .sheet-list { display: flex; flex-direction: column; }
  .sheet-option {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 8px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: #dbe1e9;
    font-size: 13px;
    text-align: left;
  }
  .sheet-option:hover { background: rgb(255 255 255 / 7%); }
  .sheet-option.active { color: var(--accent); }
  .sheet-option .opt-label { margin-left: auto; color: #8f99a7; font-size: 11.5px; }
  .sheet-empty { padding: 6px 8px 10px; color: #8f99a7; font-size: 12px; line-height: 1.5; }
  .sheet-note { margin-top: 8px; color: #7c8695; font-size: 11.5px; line-height: 1.5; }
  .toast {
    position: absolute;
    left: 50%;
    bottom: 88px;
    z-index: 9;
    transform: translateX(-50%);
    max-width: min(520px, calc(100vw - 40px));
    padding: 9px 14px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-md);
    background: rgba(12, 14, 19, 0.94);
    color: var(--bright-text);
    font-size: 13px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
  }

  /* ---------- responsive ---------- */
  @media (max-width: 1120px) {
    .header-inner { gap: 16px; }
    .nav a { padding: 8px 9px; }
    .search { width: min(250px, 26vw); }
    .hero-content { padding: 120px 22px 76px; }
    .genre-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .feature-card { flex-basis: 336px; width: 336px; }
    .detail-content { grid-template-columns: 180px minmax(0, 1fr); gap: 26px; padding: 34px; }
  }
  @media (max-width: 900px) {
    .header-inner { display: flex; flex-wrap: wrap; height: auto; padding: 10px 18px; gap: 8px 14px; }
    .nav { border-radius: var(--radius-xl); }
    .logo { order: 1; }
    .header-actions { order: 2; margin-left: auto; }
    .nav { order: 3; width: 100%; padding-bottom: 3px; }
    .search { width: min(330px, 52vw); }
    .hero { min-height: 620px; background-position: center 20%; }
    .hero-content { padding: 150px 18px 66px; min-height: 620px; }
    .hero-content h1 { max-width: 20ch; }
    .page { padding-top: 142px; }
    .detail-wrap { padding-top: 136px; }
    .row-section, .page, .detail-wrap { padding-left: 18px; padding-right: 18px; }
    .skeleton-row { padding: 0 18px; }
    .skeleton-hero { min-height: 620px; }
    .browse-hero { padding: 26px 22px; min-height: 240px; }
    .footer-inner { padding: 30px 18px 22px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .footer-bottom { padding: 14px 18px 26px; }

  /* ---------- movy pass ----------
     Values lifted from movy.sx's own stylesheet and computed styles:
     ink-950 var(--page) ground, brand #e50914, 48px gutters, 70vh billboard,
     180px poster cards at an 8px gap, 8px-radius CTA buttons. */

  :root {
    /* movy runs one sans everywhere: headings included. */
    --font-display: var(--font-ui);
    --brand: #e50914;
    --brand-hi: #ff4651;
  }

  .header-inner {
    height: var(--header);
    max-width: none;
    padding: 0 40px;
  }
  .logo-text {
    color: var(--accent);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.045em;
  }
  .logo-mark {
    width: 22px;
    height: 22px;
    color: var(--accent);
    flex: none;
  }

  /* the dock - one bar, not a slab */
  .nav {
    gap: 2px;
    padding: 3px;
    border: 1px solid var(--movy-line);
    border-radius: var(--radius-xl);
    background: color-mix(in srgb, var(--movy-surface) 97%, transparent);
    box-shadow: 0 12px 28px -14px #000000b3;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .nav a {
    height: 28px;
    padding: 0 10px;
    border-radius: var(--radius-md);
    color: var(--movy-muted);
    font-size: 12.5px;
    font-weight: 500;
  }
  .nav a svg { opacity: 1; }
  .nav a:hover {
    color: var(--bright-text);
    background: color-mix(in srgb, var(--bright-text) 6%, transparent);
  }
  .nav a.active {
    color: var(--bright-text);
    background: var(--movy-line);
    font-weight: 600;
    box-shadow: none;
  }
  .nav a.active svg { color: var(--bright-text); }
  .search input {
    height: 36px;
    border: 1px solid var(--movy-line);
    border-radius: var(--radius-xl);
    background: var(--movy-surface);
    color: var(--ink);
    font-size: 13px;
  }
  .search input::placeholder { color: var(--movy-dim); }
  .search input:focus { border-color: var(--movy-line-strong); }

  /* ---------- billboard ---------- */
  .hero {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: 70vh;
    min-height: 460px;
    max-height: none;
    background-color: var(--page);
    background-position: center 28%;
  }
  /* HeroFade: vignette + 140px seam into the ground. */
  .hero-shade {
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--hero-fade) 0%, transparent) 50%, color-mix(in srgb, var(--hero-fade) 12%, transparent) 64%, color-mix(in srgb, var(--hero-fade) 28%, transparent) 76%, color-mix(in srgb, var(--hero-fade) 46%, transparent) 86%, color-mix(in srgb, var(--hero-fade) 64%, transparent) 94%, color-mix(in srgb, var(--hero-fade) 78%, transparent) 100%),
      linear-gradient(90deg, color-mix(in srgb, var(--hero-fade) 78%, transparent) 0%, color-mix(in srgb, var(--hero-fade) 56%, transparent) 16%, color-mix(in srgb, var(--hero-fade) 36%, transparent) 32%, color-mix(in srgb, var(--hero-fade) 20%, transparent) 46%, color-mix(in srgb, var(--hero-fade) 9%, transparent) 57%, color-mix(in srgb, var(--hero-fade) 3%, transparent) 64%, color-mix(in srgb, var(--hero-fade) 0%, transparent) 70%);
  }
  .hero-shade::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 140px;
    pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--hero-fade) 0%, transparent) 0%, color-mix(in srgb, var(--hero-fade) 0%, transparent) 48%, color-mix(in srgb, var(--hero-fade) 16%, transparent) 62%, color-mix(in srgb, var(--hero-fade) 40%, transparent) 74%, color-mix(in srgb, var(--hero-fade) 68%, transparent) 86%, color-mix(in srgb, var(--hero-fade) 45%, var(--page)) 94%, var(--page) 100%);
  }
  .hero-content {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 0 48px 72px;

  .hero-title {

  .hero-title.has-logo { min-height: 96px; }

  .hero-logo {

  .hero-rank {

    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-xs);
    background: #e50914;
    color: #fff;
    font-weight: 800;

  .hero-rank i {

  .hero-tag { display: none; }

    font-size: 15px;

  .hero-meta .meta-item:not(:last-child)::after {

    height: 3px;
    margin: 0 10px;

    box-shadow: 0 0 4px #0006;

  .hero-meta .rating {
    gap: 5px;
    color: #fff;
    font-weight: 600;

    max-width: 544px;

  .hero-actions {
    align-items: center;
    gap: 10px;

  /* markers: 3px bars, 24px hit box, 46px while active */
  .hero-dots {
    right: 48px;
    bottom: 24px;
    gap: 0;
  }
  .hero-dot {
    position: relative;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-xs);
    background: transparent;
    transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .hero-dot::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 5px;
    right: 5px;
    height: 3px;
    transform: translateY(-50%);
    border-radius: var(--radius-xl);
    background: #ffffff4d;
    transition: background 0.2s;
  }
  .hero-dot:hover::after { background: #ffffff80; }
  .hero-dot.active {
    width: 46px;
    background: transparent;
  }
  .hero-dot.active::after { background: #fff; }
  .hero-arrow {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: var(--radius-xl);
    background: #141414a8;

  .btn {
    gap: 10px;

    border-radius: var(--radius-md);

  /* ---------- rows ---------- */
  .row-section {

    padding: 0 48px;

  .feature-card { flex: 0 0 320px; width: 320px; }

  /* ---------- chips (mv-chip) ---------- */

          totalResults: body.total_results,
          results: (body.results || []).map(function (item) {
            return mapItem(item);
          })

      var pair = tmdbBrowsePath(type, query);

        return {
          page: body.page,
          totalPages: body.total_pages,
          totalResults: body.total_results,
          results: (body.results || []).map(function (item) {
            return mapItem(item, type);
          })

      });
    }

    if (parts[1] === "search") {
      var kind = parts[2] === "tv" || parts[2] === "movie" ? parts[2] : "multi";
      return tmdb("/search/" + kind, {
        query: query.get("query") || "",
        page: query.get("page") || 1,
        include_adult: "false"
      }, signal).then(function (body) {
        return {
          page: body.page,
          totalPages: body.total_pages,
          totalResults: body.total_results,
          results: (body.results || [])
            .filter(function (item) { return item.media_type !== "person"; })
            .map(function (item) {
              return mapItem(item, kind === "multi" ? null : kind);
            })

      });
    }

    if (parts[1] === "tv" && parts[3] === "season") {
      return tmdb("/tv/" + parts[2] + "/season/" + parts[4], {}, signal).then(function (body) {
        return {
          id: Number(parts[2]),
          season: body.season_number,
          name: body.name || "Season " + body.season_number,
          overview: body.overview || "",
          poster: posterOf(body.poster_path),
          airDate: body.air_date || "",
          episodes: (body.episodes || []).map(function (episode) {
            return {
              number: episode.episode_number,

              overview: episode.overview || "",

      });
    }

    return tmdb("/movie/" + parts[2], {
      append_to_response: "credits,videos,release_dates,external_ids"
    }, signal).then(function (body) {
      return mapMapped(body, "movie");
    });

  function formatTime(value) {
    if (!Number.isFinite(value) || value < 0) {
      return "0:00";
    }
    var total = Math.floor(value);
    var hours = Math.floor(total / 3600);
    var minutes = Math.floor((total % 3600) / 60);
    var seconds = total % 60;
    return hours > 0
      ? hours + ":" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0")
      : minutes + ":" + String(seconds).padStart(2, "0");
  }
  function yearOf(item) {
    return item && item.releaseDate ? String(item.releaseDate).slice(0, 4) : "";
  }
  function ratingOf(item) {
    var rating = Number(item && item.rating);
    return Number.isFinite(rating) && rating > 0 ? rating.toFixed(1) : "";
  }
  function isNew(item) {
    var released = Date.parse(item && item.releaseDate ? item.releaseDate : "");
    if (!Number.isFinite(released)) { return false; }
    var age = Date.now() - released;
    return age >= 0 && age < 75 * 24 * 60 * 60 * 1000;
  }
  function metaRow(items) {

  function cardMeta(item) {
    var parts = [];

    if (item.season && item.episode) {
      parts.push("S" + item.season + "E" + item.episode);

    return parts.filter(Boolean).join(" · ");
  }
  function isTv(item) {

  }
  function detailKey(item) {
    return item.mediaType + ":" + item.id;
  }
  function routeFor(item, season, episode) {
    if (item.mediaType === "tv") {

  }
  function progressKey(mediaType, id, season, episode) {

  function sourceKey(detail, season, episode) {

  function mergeUnique(lists) {

        }

  }
  /* ---------- player preferences ---------- */
  var PREFS_KEY = "drift.movies.prefs.v1";

      captionBg: "dim",

      seekStep: 10,

      captionLang: "auto",
      autoCaptions: true,

    Object.keys(base).forEach(function (key) {

  var CAPTION_SIZES = { sm: "16px", md: "20px", lg: "26px" };
  var SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
  var SEEK_STEPS = [5, 10, 30];

  function savePrefs() { saveJson(PREFS_KEY, prefs); }

  function applyPrefs() {
    video.playbackRate = prefs.speed;
    [back10, forward10].forEach(function (button) {

  // Reads whatever cue is live on any enabled track. hls.js is told to keep its
  // own renderer off, so this is the only place captions get painted.
  function renderCaptions() {
    var tracks = video.textTracks;
    var lines = [];
    for (var i = 0; i < tracks.length; i += 1) {
      var track = tracks[i];
      if (track.kind !== "subtitles" && track.kind !== "captions") { continue; }
      if (track.mode === "disabled" || !track.activeCues) { continue; }
      for (var c = 0; c < track.activeCues.length; c += 1) {
        // Cue bodies can carry <i>/<b>/<font> markup; the overlay is plain text.
        var text = String(track.activeCues[c].text || "").replace(/<[^>]*>/g, "").trim();
        if (text) { lines.push(text); }
      }
    }
    var joined = lines.join("\n");
    if (joined === state.player.captions) { return; }
    state.player.captions = joined;
    captionsEl.replaceChildren();
    if (!joined) { return; }
    joined.split("\n").forEach(function (line) {
      var span = document.createElement("span");
      span.textContent = line;
      captionsEl.appendChild(span);
    });
  }

  function toast(message) {

  function errorBox(title, message, retry) {

  function skeletonCards(count) {

  function homeSkeleton() {

  function parseRoute() {
    var raw = location.hash.replace(/^#/, "");

      parts: split[0].split("/").filter(Boolean),

  function navigate(path) {

  function route() {
    var parsed = parseRoute();

    if (parts.length === 0) {

    }
    if (parts[0] === "movie" || parts[0] === "tv") {
      var id = Number(parts[1]);
      if (Number.isInteger(id) && id > 0) {

      var type = parts[1] === "tv" ? "tv" : parts[1] === "anime" ? "anime" : "movie";

    }

  /* ---------- home ---------- */
  async function showHome() {
    state.view = "home";
    state.homeToken += 1;
    var token = state.homeToken;
    updateNav("home");
    setSearchValue("");
    stopHeroTimer();
    window.scrollTo({ top: 0 });
    syncHeader();
    app.innerHTML = homeSkeleton();

    var requests = [
      api("/api/trending/all?page=1"),
      api("/api/browse/movie?category=popular"),
      api("/api/browse/tv?category=popular"),
      api("/api/browse/movie?genre=16"),
      api("/api/browse/tv?genre=16"),
      api("/api/browse/movie?category=top_rated"),
      api("/api/browse/movie?category=now_playing")
    ];
    HOME_GENRES.forEach(function (genre) {
      requests.push(api("/api/browse/movie?genre=" + genre.id + "&page=1"));
    });
    requests.push(api("/api/browse/tv?category=airing_today"));
    var results = await Promise.allSettled(requests);
    if (token !== state.homeToken || state.view !== "home") {
      return;
    }
    function pick(result) {
      return result.status === "fulfilled" && result.value && Array.isArray(result.value.results)
        ? result.value.results
        : [];
    }
    var trending = pick(results[0]);
    var movies = pick(results[1]);
    var shows = pick(results[2]);
    var animeMovies = pick(results[3]).filter(function (item) { return item.isAnime; });
    var animeShows = pick(results[4]).filter(function (item) { return item.isAnime; });
    var topRated = pick(results[5]);
    var nowPlaying = pick(results[6]);
    var airingToday = pick(results[7 + HOME_GENRES.length]);
    var anime = mergeUnique([animeMovies, animeShows]);
    var usedGenreImages = {};
    state.homeGenres = HOME_GENRES.map(function (genre, index) {
      var list = pick(results[7 + index]).filter(function (item) { return item.backdrop; });
      var chosen = "";
      for (var step = 0; step < list.length && chosen === ""; step += 1) {
        var candidate = list[(step + index * 2 + 1) % list.length];
        if (candidate && candidate.backdrop && !usedGenreImages[candidate.backdrop]) {
          chosen = candidate.backdrop;
          usedGenreImages[chosen] = true;
        }

    }).filter(Boolean);

    app.innerHTML = "";
    if (state.hero.length > 0) {
      app.appendChild(renderHero());
    }

    var rows = [];
    var continueItems = continueWatchingItems();
    if (continueItems.length > 0) {
      rows.push(renderRow("Continue Watching", continueItems, { progress: true }));
    }
    if (trending.length > 0) {
      rows.push(renderRow("Top 10 Today", trending.slice(0, 10), { rank: true, featureFirst: true }));
      rows.push(renderRow("Trending This Week", trending));
    }
    if (nowPlaying.length > 0) {
      rows.push(renderRow("Now Playing in Theaters", nowPlaying, { seeAll: "#/browse/movie?category=now_playing" }));
    }
    if (movies.length > 0) {
      rows.push(renderRow("Popular Movies", movies, { seeAll: "#/browse/movie" }));
    }
    if (shows.length > 0) {
      rows.push(renderRow("Popular TV Shows", shows, { seeAll: "#/browse/tv" }));
    }
    if (airingToday.length > 0) {
      rows.push(renderRow("Airing Today", airingToday, { seeAll: "#/browse/tv?category=airing_today" }));
    }
    if (anime.length > 0) {
      rows.push(renderRow("Anime Spotlight", anime, { seeAll: "#/browse/anime" }));
    }
    if (topRated.length > 0) {
      rows.push(renderRow("Critically Acclaimed", topRated, { seeAll: "#/browse/movie?category=top_rated" }));
    }
    rows.forEach(function (row) {
      if (row) { app.appendChild(row); }

    var genres = renderGenreTiles(state.homeGenres);

  // TMDB ships transparent title art for most titles; movy swaps it in and keeps

  var heroLogos = {};

    var key = detailKey(item);

      .then(function (data) {
        var logos = (data && data.logos) || [];
        var best = logos.filter(function (logo) { return logo.iso_639_1 === "en"; })[0] || logos[0];
        heroLogos[key] = best ? best.file_path : null;

  function renderRow(title, items, options) {
    if (!items || items.length === 0) {
      return null;

    var section = document.createElement("section");

    scroller.className = "row-scroller";

      if (options.featureFirst && index === 0) {
        scroller.appendChild(featureCard(item, 1));

      }
      scroller.appendChild(card(item, {
        rank: options.rank ? index + 1 : 0,

      }));
    });

      next.type = "button";

      next.innerHTML = icon("chevronRight", { size: 18 });

  function card(item, options) {

    article.setAttribute("role", "link");
    article.setAttribute("aria-label", item.title + " — " + typeLabel(item));
    var progress = Number(options.progress || 0);
    if (!Number.isFinite(progress)) { progress = 0; }
    progress = Math.max(0, Math.min(1, progress));
    var poster = item.poster
      ? '<img loading="lazy" src="' + esc(item.poster) + '" alt="">'
      : '<div class="poster-fallback">' + esc(String(item.title || "?").slice(0, 1)) + "</div>";
    var flags = (ratingOf(item) ? '<span class="rating">' + icon("star", { fill: true, size: 10 }) + " " + esc(ratingOf(item)) + "</span>" : "") +
      (isNew(item) ? '<span class="card-new">New</span>' : "");
    article.innerHTML =
      '<div class="card-poster">' +
        poster +
        '<div class="card-shade"></div>' +
        '<div class="card-top">' +
          '<span class="card-flags">' + flags + "</span>" +
        "</div>" +
        '<button class="card-play" type="button" aria-label="Play ' + esc(item.title) + '">' + icon("play", { fill: true, size: 18 }) + "</button>" +
        (options.rank ? '<span class="rank">' + options.rank + "</span>" : "") +
        (progress > 0 ? '<div class="card-progress"><span style="width:' + (progress * 100).toFixed(1) + '%"></span></div>' : "") +
      "</div>" +
      '<div class="card-title">' + esc(item.title) + "</div>" +
      '<div class="card-meta">' + esc(cardMeta(item)) + "</div>";

    article.addEventListener("click", function (event) {
      if (event.target.closest("button")) { return; }
      navigate(routeFor(item, item.season, item.episode));
    });
    article.addEventListener("keydown", function (event) {
      if ((event.key === "Enter" || event.key === " ") && !event.target.closest("button")) {
        event.preventDefault();
        navigate(routeFor(item, item.season, item.episode));
      }
    });
    article.querySelector(".card-play").addEventListener("click", function (event) {
      event.stopPropagation();
      playItem(item, item.season, item.episode);
    });
    return article;
  }
